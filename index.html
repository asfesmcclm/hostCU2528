<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convenio de Hostelería de Cuenca 2025–2028 · FeSMC-UGT Cuenca</title>
<style>
:root{--bg:#fff;--sf:#f5f6f8;--tx:#1b1f24;--mu:#5d6772;--bd:#dde1e6;--ac:#b3363f;--hd:#c0444c;--mk:#ffe58a;--mt:#1b1f24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--sf:#1e2227;--tx:#e8eaed;--mu:#9aa4af;--bd:#333a42;--ac:#ff7a85;--hd:#7d2a31;--mk:#7a6200;--mt:#fff}}
:root[data-theme="dark"]{--bg:#15181c;--sf:#1e2227;--tx:#e8eaed;--mu:#9aa4af;--bd:#333a42;--ac:#ff7a85;--hd:#7d2a31;--mk:#7a6200;--mt:#fff}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;overflow-x:hidden}main,section{min-width:0}section{overflow-wrap:break-word}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.in{max-width:1100px;margin:auto}
.hero{background:var(--hd);color:#fff;padding:8px 14px 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.lg{height:28px;width:auto;flex:none}
.tt{text-align:center;margin:4px 0 2px;line-height:1.25}
.s2{font-size:clamp(.78rem,3.4vw,1rem);letter-spacing:.04em}
.s4{font-size:clamp(1.5rem,7vw,2rem);line-height:1.1}
.s5{letter-spacing:.14em;font-size:clamp(.7rem,3.2vw,.95rem);margin-left:6px}.bop{flex:1;text-align:right;font-size:.58rem;line-height:1.3;opacity:.92}
.hero button,.bar button{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}.hero button{padding:3px 9px;flex:none}.row button{flex:none;font-size:.82rem;padding:8px 10px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:2px 14px 8px;border-radius:0 0 0 22px}
.bar button.on{background:#fff;color:var(--hd);border-color:#fff}.bar #q{background:#fff;color:#1b1f24;border-color:#fff}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 0;scrollbar-width:thin}
#chips button{white-space:nowrap;font-size:.8rem;padding:4px 10px;border-radius:99px}
#st{font-size:.8rem;color:rgba(255,255,255,.88);margin-top:4px}
.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:16px 14px 60px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start;max-height:calc(100vh - 160px);overflow:auto;font-size:.85rem}
nav b{display:block;margin:10px 0 4px;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
nav a{display:block;padding:3px 8px;color:var(--tx);text-decoration:none;border-radius:6px;line-height:1.35}
nav a:hover{background:var(--sf)}
section{border:1px solid var(--bd);border-radius:12px;padding:6px 18px 12px;margin:0 0 14px;background:var(--bg)}
section h2{font-size:1.05rem;margin:12px 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;color:var(--ac)}
section h2 button{font-size:.72rem;padding:3px 8px;flex:none;color:var(--mu)}
section .c{font-size:.72rem;color:var(--mu);margin-top:10px}
.tbl{overflow-x:auto;max-width:100%;margin:8px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;font-size:.85rem;min-width:100%;width:max-content}
td,th{border:1px solid var(--bd);padding:5px 8px;vertical-align:top}th{background:var(--sf)}
mark{background:var(--mk);color:var(--mt);border-radius:3px;padding:0 1px}
#none{display:none;text-align:center;color:var(--mu);padding:40px 0}
@media(max-width:800px){.wrap{grid-template-columns:minmax(0,1fr);padding:12px 10px 50px}nav{display:none}section{padding:4px 14px 10px}}
@media print{.bar,nav,button{display:none}.hero{background:none;color:#000}.wrap{display:block}section{break-inside:avoid;border:0}}

<script type="application/json" id="d">[{"id": "art-1", "t": "Artículo 1. Partes Firmantes", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 1, "h": "<p>El presente Convenio Colectivo ha sido suscrito, de una parte, como representación sindical, por la Federación de Servicios para la Movilidad y el Consumo de la Unión General de Trabajadoras y Trabajadores (FeSMC-UGT) de Cuenca y la Federación de Servicios de Comisiones Obreras (CCOO-Servicios) de Cuenca; y de otra parte, como representación empresarial, por la Agrupación Provincial de Hostelería y Turismo (APHT) de Cuenca.<\/p>", "x": "El presente Convenio Colectivo ha sido suscrito, de una parte, como representación sindical, por la Federación de Servicios para la Movilidad y el Consumo de la Unión General de Trabajadoras y Trabajadores (FeSMC-UGT) de Cuenca y la Federación de Servicios de Comisiones Obreras (CCOO-Servicios) de Cuenca; y de otra parte, como representación empresarial, por la Agrupación Provincial de Hostelería y Turismo (APHT) de Cuenca."}, {"id": "art-2", "t": "Artículo 2. Ámbito funcional y personal", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 2, "h": "<p>Los ámbitos funcional y personal de este Convenio Colectivo, son los establecidos en el Acuerdo Laboral de Ámbito Estatal para el Sector de Hostelería (ALEH) vigente en cada momento.<\/p>", "x": "Los ámbitos funcional y personal de este Convenio Colectivo, son los establecidos en el Acuerdo Laboral de Ámbito Estatal para el Sector de Hostelería (ALEH) vigente en cada momento."}, {"id": "art-3", "t": "Artículo 3. Ámbito territorial", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 3, "h": "<p>Este Convenio Colectivo afecta a todos los centros de trabajo incluidos en su ámbito funcional, radicados en la provincia de Cuenca.<\/p>", "x": "Este Convenio Colectivo afecta a todos los centros de trabajo incluidos en su ámbito funcional, radicados en la provincia de Cuenca."}, {"id": "art-4", "t": "Artículo 4. Ámbito temporal, vigencia, denuncia y prórroga", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 4, "h": "<ol>\n<li>La vigencia de este Convenio Colectivo será de cuatro años, desde el 1 de enero de 2025 hasta el 31 de diciembre de 2028.<\/li>\n<\/ol><ol>\n<li>Una vez finalizada su vigencia, quedará denunciado automáticamente a 31 de diciembre de 2028, sin necesidad de denuncia expresa por las partes. De igual manera, el contenido del presente convenio, seguirá vigente hasta que sea sustituido por otro.<\/li>\n<\/ol>", "x": " La vigencia de este Convenio Colectivo será de cuatro años, desde el 1 de enero de 2025 hasta el 31 de diciembre de 2028. Una vez finalizada su vigencia, quedará denunciado automáticamente a 31 de diciembre de 2028, sin necesidad de denuncia expresa por las partes. De igual manera, el contenido del presente convenio, seguirá vigente hasta que sea sustituido por otro. "}, {"id": "art-5", "t": "Artículo 5. Condiciones más beneficiosas. Compensación y absorción. Garantías personales", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 5, "h": "<p>Las condiciones que se establecen en este convenio tendrán la consideración de mínimas y obligatorias para todas las empresas comprendidas en su ámbito de aplicación.<\/p><p>Se respetarán las condiciones más beneficiosas en cada caso concreto que tengan establecidas las empresas en el momento de la publicación de este convenio.<\/p><p>Las condiciones establecidas en el presente convenio, consideradas en su conjunto, podrán ser compensadas con las ya existentes en el momento de su entrada en vigor, cualquiera que sea el origen y causa de las mismas. Asimismo podrán ser absorbidas por otras condiciones superiores fijas por disposición legal, contrato individual, concesiones voluntarias, etc., que pudieran aplicarse en lo sucesivo.<\/p>", "x": "Las condiciones que se establecen en este convenio tendrán la consideración de mínimas y obligatorias para todas las empresas comprendidas en su ámbito de aplicación. Se respetarán las condiciones más beneficiosas en cada caso concreto que tengan establecidas las empresas en el momento de la publicación de este convenio. Las condiciones establecidas en el presente convenio, consideradas en su conjunto, podrán ser compensadas con las ya existentes en el momento de su entrada en vigor, cualquiera que sea el origen y causa de las mismas. Asimismo podrán ser absorbidas por otras condiciones superiores fijas por disposición legal, contrato individual, concesiones voluntarias, etc., que pudieran aplicarse en lo sucesivo."}, {"id": "art-6", "t": "Artículo 6. Vinculación a la totalidad", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 6, "h": "<p>Las condiciones pactadas en el presente Convenio Colectivo constituyen un todo orgánico e indivisible y a efectos de su aplicación práctica serán consideradas globalmente.<\/p><p>En el supuesto de que por modificación legislativa, resolución administrativa o decisión judicial, recaída en conflicto individual o colectivo de trabajo, se modificara o anulara alguno de sus pactos, las partes firmantes del mismo vendrán obligadas a abrir una nueva negociación colectiva tendente a renegociar el contenido o contenidos expresamente afectados por dicha resolución.<\/p>", "x": "Las condiciones pactadas en el presente Convenio Colectivo constituyen un todo orgánico e indivisible y a efectos de su aplicación práctica serán consideradas globalmente. En el supuesto de que por modificación legislativa, resolución administrativa o decisión judicial, recaída en conflicto individual o colectivo de trabajo, se modificara o anulara alguno de sus pactos, las partes firmantes del mismo vendrán obligadas a abrir una nueva negociación colectiva tendente a renegociar el contenido o contenidos expresamente afectados por dicha resolución."}, {"id": "art-7", "t": "Artículo 7. Derecho supletorio", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 7, "h": "<p>En lo no dispuesto en este Convenio Colectivo, se estará a lo establecido en el Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería, el Estatuto de los Trabajadores, y demás legislación que regule las condiciones laborales.<\/p>", "x": "En lo no dispuesto en este Convenio Colectivo, se estará a lo establecido en el Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería, el Estatuto de los Trabajadores, y demás legislación que regule las condiciones laborales."}, {"id": "art-8", "t": "Artículo 8. Cláusula de Inaplicación del Convenio Colectivo", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 8, "h": "<p>Se estará a lo dispuesto en el artículo 82.3 del Estatuto de los Trabajadores.<\/p>", "x": "Se estará a lo dispuesto en el artículo 82.3 del Estatuto de los Trabajadores."}, {"id": "art-9", "t": "Artículo 9. Comisión Paritaria", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 9, "h": "<p>De acuerdo al artículo 85.3.c y 85.3.e del Estatuto de los Trabajadores, se constituye una Comisión Paritaria del Convenio, que estará formada por 2 vocales nombrados por la parte empresarial y 2 nombrados por la parte sindical.<\/p><p>Las funciones de esta Comisión Paritaria serán:<\/p><ol>\n<li>Interpretación del Convenio y entender de los términos y condiciones para el conocimiento y resolución de las cuestiones en materia de aplicación e interpretación del Convenio Colectivo.<\/li>\n<\/ol><ol>\n<li>Mediación en los problemas y cuestiones que les sean sometidos.<\/li>\n<\/ol><ol>\n<li>Vigilancia del cumplimiento de lo pactado.<\/li>\n<\/ol><ol>\n<li>Evacuar los informes requeridos por la autoridad laboral.<\/li>\n<\/ol><ol>\n<li>Conocer de la inaplicación de las condiciones del presente Convenio Colectivo a aquellas empresas que así lo soliciten y entender de los términos y condiciones para el conocimiento y resolución de las discrepancias tras la finalización del periodo de consultas en materia de modificación sustancial de condiciones de trabajo o inaplicación de las condiciones del Convenio Colectivo, de acuerdo con lo establecido en los artículos 41.6 y 82.3 del Estatuto de los Trabajadores.<\/li>\n<\/ol><ol>\n<li>La intervención que se acuerde en los supuestos de modificación sustancial de condiciones de trabajo o inaplicación de las condiciones del Convenio Colectivo, cuando no exista representación legal de las personas trabajadoras en la empresa.<\/li>\n<\/ol><ol>\n<li>Emitir informe o dictamen vinculante para la parte que lo solicite de cuantas cuestiones y conflictos individuales o colectivos les sean sometidos a la misma, siempre y cuando afecten a la interpretación del articulado del presente Convenio Colectivo.<\/li>\n<\/ol><ol>\n<li>Cuantas otras actividades tiendan a la eficacia de lo pactado, así como el desarrollo de funciones de adaptación o, en su caso, modificación del convenio durante su vigencia. En este caso, deberá incorporarse a la comisión paritaria la totalidad de los sujetos legitimados para la negociación, aunque no hayan sido firmantes del convenio, siendo exigible la concurrencia de los requisitos de legitimación previstos en los artículos 87 y 88 del Estatuto de los Trabajadores para que los acuerdos de modificación posean eficacia general.<\/li>\n<\/ol><ol>\n<li>Cualesquiera otras que expresamente le vengan atribuidas por el articulado del presente Convenio Colectivo.<\/li>\n<\/ol><p>Ambas partes convienen en dar conocimiento a la Comisión Paritaria de cuantas dudas, discrepancias y conflictos se produzcan como consecuencia de la interpretación del Convenio.<\/p><p>La Comisión Paritaria se reunirá siempre a instancia de parte legítima, mediante solicitud por escrito dirigido a la misma y, en el cual, se hará constar necesariamente el asunto objeto de la convocatoria y los puntos de controversia.<\/p><p>La Comisión Paritaria, una vez recibido el escrito de consulta o, en su caso, complementada la información pertinente, dispondrá de un plazo no superior a veinte días hábiles para resolver la cuestión suscitada o, si ello no fuera posible, emitir el oportuno dictamen. Transcurrido dicho plazo sin haberse producido resolución ni dictamen, quedará abierta la vía administrativa o jurisdiccional competente.<\/p><p>El domicilio social de esta Comisión Paritaria a los efectos oportunos se fija en la sede de la Delegación en Cuenca del Jurado Arbitral de Castilla La Mancha, en la Calle Parque San Julián, 13 de Cuenca, CP 16001, Tfno. 969179817, email: <a>juradoarbitralcu@jccm.es<\/a><\/p>", "x": "De acuerdo al artículo 85.3.c y 85.3.e del Estatuto de los Trabajadores, se constituye una Comisión Paritaria del Convenio, que estará formada por 2 vocales nombrados por la parte empresarial y 2 nombrados por la parte sindical. Las funciones de esta Comisión Paritaria serán: Interpretación del Convenio y entender de los términos y condiciones para el conocimiento y resolución de las cuestiones en materia de aplicación e interpretación del Convenio Colectivo. Mediación en los problemas y cuestiones que les sean sometidos. Vigilancia del cumplimiento de lo pactado. Evacuar los informes requeridos por la autoridad laboral. Conocer de la inaplicación de las condiciones del presente Convenio Colectivo a aquellas empresas que así lo soliciten y entender de los términos y condiciones para el conocimiento y resolución de las discrepancias tras la finalización del periodo de consultas en materia de modificación sustancial de condiciones de trabajo o inaplicación de las condiciones del Convenio Colectivo, de acuerdo con lo establecido en los artículos 41.6 y 82.3 del Estatuto de los Trabajadores. La intervención que se acuerde en los supuestos de modificación sustancial de condiciones de trabajo o inaplicación de las condiciones del Convenio Colectivo, cuando no exista representación legal de las personas trabajadoras en la empresa. Emitir informe o dictamen vinculante para la parte que lo solicite de cuantas cuestiones y conflictos individuales o colectivos les sean sometidos a la misma, siempre y cuando afecten a la interpretación del articulado del presente Convenio Colectivo. Cuantas otras actividades tiendan a la eficacia de lo pactado, así como el desarrollo de funciones de adaptación o, en su caso, modificación del convenio durante su vigencia. En este caso, deberá incorporarse a la comisión paritaria la totalidad de los sujetos legitimados para la negociación, aunque no hayan sido firmantes del convenio, siendo exigible la concurrencia de los requisitos de legitimación previstos en los artículos 87 y 88 del Estatuto de los Trabajadores para que los acuerdos de modificación posean eficacia general. Cualesquiera otras que expresamente le vengan atribuidas por el articulado del presente Convenio Colectivo. Ambas partes convienen en dar conocimiento a la Comisión Paritaria de cuantas dudas, discrepancias y conflictos se produzcan como consecuencia de la interpretación del Convenio. La Comisión Paritaria se reunirá siempre a instancia de parte legítima, mediante solicitud por escrito dirigido a la misma y, en el cual, se hará constar necesariamente el asunto objeto de la convocatoria y los puntos de controversia. La Comisión Paritaria, una vez recibido el escrito de consulta o, en su caso, complementada la información pertinente, dispondrá de un plazo no superior a veinte días hábiles para resolver la cuestión suscitada o, si ello no fuera posible, emitir el oportuno dictamen. Transcurrido dicho plazo sin haberse producido resolución ni dictamen, quedará abierta la vía administrativa o jurisdiccional competente. El domicilio social de esta Comisión Paritaria a los efectos oportunos se fija en la sede de la Delegación en Cuenca del Jurado Arbitral de Castilla La Mancha, en la Calle Parque San Julián, 13 de Cuenca, CP 16001, Tfno. 969179817, email: juradoarbitralcu@jccm.es"}, {"id": "art-10", "t": "Artículo 10. Solución Autónoma de Conflictos Laborales (III ASAC)", "k": "art", "c": "Capítulo I · Disposiciones generales", "n": 10, "h": "<p>Las partes firmantes del presente Convenio se adhieren al III Acuerdo de Solución Autónoma de Conflictos Laborales de Castilla-La Mancha (III ASAC, DOCM, Nº 55, de 20 de marzo de 2014), que vinculará a la totalidad de las empresas y a la totalidad de personas trabajadoras representadas, actuando en primera instancia la Comisión Paritaria de este Convenio.<\/p>", "x": "Las partes firmantes del presente Convenio se adhieren al III Acuerdo de Solución Autónoma de Conflictos Laborales de Castilla-La Mancha (III ASAC, DOCM, Nº 55, de 20 de marzo de 2014), que vinculará a la totalidad de las empresas y a la totalidad de personas trabajadoras representadas, actuando en primera instancia la Comisión Paritaria de este Convenio."}, {"id": "art-11", "t": "Artículo 11. Contrato de fijo discontinuo", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 11, "h": "<p>En la regulación del contrato fijo discontinuo se estará a lo dispuesto en el artículo 16.4 del Estatuto de los Trabajadores. No obstante y debido a las peculiaridades de actividad del sector de hostelería, los contratos fijos discontinuos podrán concertarse a tiempo parcial.<\/p><p>El periodo garantizado de actividad de las personas trabajadoras con contrato fijo discontinuo será del 70% de la media de horas realizadas en los últimos tres años<\/p><p>El llamamiento será realizado como norma general con al menos 5 días previos a la prestación de servicios. Ante situaciones imprevisibles el plazo se rebajará a 48 horas.<\/p><p>El llamamiento deberá efectuarse por cualquier medio que permita tener constancia de manera fehaciente del mismo, siempre mediante notificación por escrito, a través de medios telemáticos tales como SMS, email, Whatsapp, etc. Será obligación de la persona trabajadora comunicar cualquier variación en los datos a efectos de comunicación.<\/p><p>Cualquier rechazo del llamamiento por la vía general (al menos 5 días previos a la prestación de servicios), entendiendo por general los trabajos que se repitan cada año de manera periódica y con una duración de al menos 7 días, podrá suponer la baja voluntaria de la persona trabajadora.<\/p><p>En el caso de rechazo del llamamiento en 5 ocasiones a lo largo del año natural, en situaciones imprevisibles, de refuerzo <\/p><ol>\n<li>servicios extras de corta duración (48 horas previas a la prestación de servicios) podrá suponer la baja voluntaria de la persona trabajadora.<\/li>\n<\/ol><p>En ningún caso será considerado rechazado el llamamiento cuando la persona trabajadora justifique la ausencia con cualquiera de las licencias recogidas en el artículo 44 del presente convenio.<\/p><p>El llamamiento se efectuará por orden de antigüedad de la empresa dentro de cada grupo profesional. Sin embargo para la prestación del servicio ante situaciones imprevisibles se realizará, en función de las necesidades de la empresa por rotación de las personas trabajadoras.<\/p>", "x": "En la regulación del contrato fijo discontinuo se estará a lo dispuesto en el artículo 16.4 del Estatuto de los Trabajadores. No obstante y debido a las peculiaridades de actividad del sector de hostelería, los contratos fijos discontinuos podrán concertarse a tiempo parcial. El periodo garantizado de actividad de las personas trabajadoras con contrato fijo discontinuo será del 70% de la media de horas realizadas en los últimos tres años El llamamiento será realizado como norma general con al menos 5 días previos a la prestación de servicios. Ante situaciones imprevisibles el plazo se rebajará a 48 horas. El llamamiento deberá efectuarse por cualquier medio que permita tener constancia de manera fehaciente del mismo, siempre mediante notificación por escrito, a través de medios telemáticos tales como SMS, email, Whatsapp, etc. Será obligación de la persona trabajadora comunicar cualquier variación en los datos a efectos de comunicación. Cualquier rechazo del llamamiento por la vía general (al menos 5 días previos a la prestación de servicios), entendiendo por general los trabajos que se repitan cada año de manera periódica y con una duración de al menos 7 días, podrá suponer la baja voluntaria de la persona trabajadora. En el caso de rechazo del llamamiento en 5 ocasiones a lo largo del año natural, en situaciones imprevisibles, de refuerzo servicios extras de corta duración (48 horas previas a la prestación de servicios) podrá suponer la baja voluntaria de la persona trabajadora. En ningún caso será considerado rechazado el llamamiento cuando la persona trabajadora justifique la ausencia con cualquiera de las licencias recogidas en el artículo 44 del presente convenio. El llamamiento se efectuará por orden de antigüedad de la empresa dentro de cada grupo profesional. Sin embargo para la prestación del servicio ante situaciones imprevisibles se realizará, en función de las necesidades de la empresa por rotación de las personas trabajadoras."}, {"id": "art-12", "t": "Artículo 12. Contrato de duración determinada", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 12, "h": "<p>Se estará a lo establecido en el artículo 15.1 del Estatuto de los Trabajadores, siendo su duración máxima de diez meses. En caso de que el contrato se hubiera concertado por una duración inferior a esta, podrá prorrogarse mediante acuerdo de las partes, por una única vez, sin que la duración total del contrato pueda exceder de dicha duración máxima.<\/p>", "x": "Se estará a lo establecido en el artículo 15.1 del Estatuto de los Trabajadores, siendo su duración máxima de diez meses. En caso de que el contrato se hubiera concertado por una duración inferior a esta, podrá prorrogarse mediante acuerdo de las partes, por una única vez, sin que la duración total del contrato pueda exceder de dicha duración máxima."}, {"id": "art-13", "t": "Artículo 13. Contrato a tiempo parcial", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 13, "h": "<p>Se estará a lo dispuesto en el artículo 12 del Estatuto de los Trabajadores.<\/p>", "x": "Se estará a lo dispuesto en el artículo 12 del Estatuto de los Trabajadores."}, {"id": "art-14", "t": "Artículo 14. Contrato para la obtención de la práctica profesional", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 14, "h": "<p>Se estará a lo establecido en el artículo 11.3 del Estatuto de los Trabajadores. De acuerdo al apartado i) de dicho artículo, la retribución de dicho contrato será la establecida en este mismo Convenio Colectivo.<\/p>", "x": "Se estará a lo establecido en el artículo 11.3 del Estatuto de los Trabajadores. De acuerdo al apartado i) de dicho artículo, la retribución de dicho contrato será la establecida en este mismo Convenio Colectivo."}, {"id": "art-15", "t": "Artículo 15. Contrato de formación en alternancia", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 15, "h": "<p>Se estará a lo establecido en el artículo 11.2 del Estatuto de los Trabajadores. De acuerdo al apartado m) de dicho artículo, la retribución de dicho contrato será la establecida en este mismo Convenio Colectivo.<\/p>", "x": "Se estará a lo establecido en el artículo 11.2 del Estatuto de los Trabajadores. De acuerdo al apartado m) de dicho artículo, la retribución de dicho contrato será la establecida en este mismo Convenio Colectivo."}, {"id": "art-16", "t": "Artículo 16. Vacantes", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 16, "h": "<p>Cuando se produzca una vacante en la empresa será puesta en conocimiento de la Representación Legal de las Personas Trabajadoras (RLPT) en la empresa, si esta existe y, a no ser que corresponda la amortización del puesto, será cubierta de forma preferente, por personal de la empresa con la preparación suficiente para cubrirla, de acuerdo en todo caso con las facultades y directivas del empresario, y siempre que la normativa legal no establezca lo contrario.<\/p>", "x": "Cuando se produzca una vacante en la empresa será puesta en conocimiento de la Representación Legal de las Personas Trabajadoras (RLPT) en la empresa, si esta existe y, a no ser que corresponda la amortización del puesto, será cubierta de forma preferente, por personal de la empresa con la preparación suficiente para cubrirla, de acuerdo en todo caso con las facultades y directivas del empresario, y siempre que la normativa legal no establezca lo contrario."}, {"id": "art-17", "t": "Artículo 17. Periodo de prueba", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 17, "h": "<p>Se estará a lo establecido en el Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería.<\/p>", "x": "Se estará a lo establecido en el Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería."}, {"id": "art-18", "t": "Artículo 18. Contratos de trabajo", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 18, "h": "<p>Los contratos de trabajo se formalizarán por escrito, especificando las condiciones de trabajo. De los contratos de trabajo se facilitará una copia a la persona trabajadora en el momento de la firma del mismo. Se entregará copia básica del contrato a la RLPT, con los límites y requisitos legalmente establecidos. En los casos de subcontratación la RLPT de la empresa principal deberá recibir la misma documentación.<\/p>", "x": "Los contratos de trabajo se formalizarán por escrito, especificando las condiciones de trabajo. De los contratos de trabajo se facilitará una copia a la persona trabajadora en el momento de la firma del mismo. Se entregará copia básica del contrato a la RLPT, con los límites y requisitos legalmente establecidos. En los casos de subcontratación la RLPT de la empresa principal deberá recibir la misma documentación."}, {"id": "art-19", "t": "Artículo 19. Cambio de empresario", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 19, "h": "<p>El cambio de la titularidad de la Empresa, Centro de Trabajo o de una Unidad productiva Autónoma de la misma, no extinguirá por sí mismo la relación laboral, quedando el nuevo empresario subrogado en los derechos y obligaciones laborales del anterior.<\/p><p>Cuando el cambio tenga lugar por actos intervivos, el cedente, y en su defecto el cesionario, está obligado a notificar dicho cambio a la Representación Legal de las Personas Trabajadoras (RLPT) de la empresa cedida, respondiendo ambos solidariamente durante tres años de las obligaciones laborales nacidas con anterioridad a la transmisión y que no hubieran sido satisfechas.<\/p>", "x": "El cambio de la titularidad de la Empresa, Centro de Trabajo o de una Unidad productiva Autónoma de la misma, no extinguirá por sí mismo la relación laboral, quedando el nuevo empresario subrogado en los derechos y obligaciones laborales del anterior. Cuando el cambio tenga lugar por actos intervivos, el cedente, y en su defecto el cesionario, está obligado a notificar dicho cambio a la Representación Legal de las Personas Trabajadoras (RLPT) de la empresa cedida, respondiendo ambos solidariamente durante tres años de las obligaciones laborales nacidas con anterioridad a la transmisión y que no hubieran sido satisfechas."}, {"id": "art-20", "t": "Artículo 20. Dimisión", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 20, "h": "<p>Las personas trabajadoras que deseen cesar voluntariamente en el servicio de la empresa, vendrán obligadas a ponerlo en conocimiento de la misma con una antelación mínima de 15 días a la fecha prevista para el cese, excepto durante el período de prueba.<\/p><p>El incumplimiento por parte de la persona trabajadora de la obligación de preavisar con la antelación señalada en el párrafo anterior, dará derecho a la empresa a descontar de la liquidación el importe de un día de salario por cada día de retraso en el preaviso.<\/p>", "x": "Las personas trabajadoras que deseen cesar voluntariamente en el servicio de la empresa, vendrán obligadas a ponerlo en conocimiento de la misma con una antelación mínima de 15 días a la fecha prevista para el cese, excepto durante el período de prueba. El incumplimiento por parte de la persona trabajadora de la obligación de preavisar con la antelación señalada en el párrafo anterior, dará derecho a la empresa a descontar de la liquidación el importe de un día de salario por cada día de retraso en el preaviso."}, {"id": "art-21", "t": "Artículo 21. Jubilación parcial y contrato de relevo", "k": "art", "c": "Capítulo II · Contratación y empleo", "n": 21, "h": "<p>La persona trabajadora afectada por el presente convenio colectivo que lo solicite y reúna los requisitos legales para ello, podrá acceder a la jubilación parcial regulada en el artículo 215.2 de la Ley General de la Seguridad Social (Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social) y el artículo 12.6 del Estatuto de los Trabajadores.<\/p><p>La persona trabajadora que decida optar a una jubilación parcial deberá comunicarlo a la empresa, quedando está obligada a aceptar dicha decisión y realizar un contrato de relevo en los términos establecidos en el artículo 12.7 del Estatuto de los Trabajadores.<\/p>", "x": "La persona trabajadora afectada por el presente convenio colectivo que lo solicite y reúna los requisitos legales para ello, podrá acceder a la jubilación parcial regulada en el artículo 215.2 de la Ley General de la Seguridad Social (Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social) y el artículo 12.6 del Estatuto de los Trabajadores. La persona trabajadora que decida optar a una jubilación parcial deberá comunicarlo a la empresa, quedando está obligada a aceptar dicha decisión y realizar un contrato de relevo en los términos establecidos en el artículo 12.7 del Estatuto de los Trabajadores."}, {"id": "art-22", "t": "Artículo 22. Derechos sindicales", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 22, "h": "<p>La empresa considera a los Sindicatos debidamente implantados en la plantilla como elementos básicos y consustanciales para afrontar a través de ellos las necesarias relaciones entre personas trabajadoras y empresa. Todo ello sin demérito de las atribuciones conferidas por la Ley a los Comités de Empresa, Delegados y Delegadas de Personal.<\/p><p>La empresa respetará el derecho de todas las personas trabajadoras a sindicarse libremente, no podrá sujetar el empleo de una persona trabajadora a la condición de que no se afilie o renuncie a su afiliación sindical. No obstante, en materia de derechos y garantías sindicales, se estará a lo dispuesto en el Estatuto de los Trabajadores.<\/p>", "x": "La empresa considera a los Sindicatos debidamente implantados en la plantilla como elementos básicos y consustanciales para afrontar a través de ellos las necesarias relaciones entre personas trabajadoras y empresa. Todo ello sin demérito de las atribuciones conferidas por la Ley a los Comités de Empresa, Delegados y Delegadas de Personal. La empresa respetará el derecho de todas las personas trabajadoras a sindicarse libremente, no podrá sujetar el empleo de una persona trabajadora a la condición de que no se afilie o renuncie a su afiliación sindical. No obstante, en materia de derechos y garantías sindicales, se estará a lo dispuesto en el Estatuto de los Trabajadores."}, {"id": "art-23", "t": "Artículo 23. Igualdad", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 23, "h": "<p>Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería<\/p>", "x": "Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería"}, {"id": "art-24", "t": "Artículo 24. Medidas dirigidas a promover la igualdad de trato de oportunidades entre mujeres y hombres en el ámbito laboral", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 24, "h": "<ul>\n<li>Las empresas se comprometen a la consecución de la igualdad real efectiva (de trato y oportunidades) de mujeres y hombres en el acceso a la empresa, la contratación y las condiciones de trabajo, la promoción profesional, la formación, la retribución, la conciliación de la vida personal, familiar y laboral y la salud laboral, garantizando los recursos humanos y materiales que sean necesarios para su debida implantación, seguimiento y evaluación.<\/li>\n<li>A tal efecto se creará una Comisión de seguimiento integrada por dos representantes de la empresa y dos representantes de las personas trabajadoras, para analizar los cumplimientos en materia de igualdad.<\/li>\n<li>Asimismo, se respetara la igualdad de trato y de oportunidades en el ámbito laboral y, con esta finalidad, deberán adoptarse medidas dirigidas a evitar cualquier tipo de discriminación laboral por razones de género, estado civil, edad, raza, nacionalidad, condición social, ideas religiosas o políticas, afiliación o no a un sindicato, así como por razones de lengua, entre mujeres y hombres, medidas que deberán negociar y en su caso acordar, con la representación legal de las personas trabajadoras, conforme determine la legislación laboral y que respetaran los siguientes principios:<\/li>\n<li>El establecimiento de sistemas de selección, clasificación, promoción y formación sobre la base de criterios técnicos, objetivos y neutros por razón de género que respetaran el principio de igualdad de oportunidades.<\/li>\n<li>La no discriminación por razón de sexo en materia de retribuciones, jornada laboral y demás condiciones de trabajo.<\/li>\n<li>Las ofertas de empleo se redactaran de manera que no contengan mención alguna que induzca a pensar que las mismas se dirigen exclusivamente a personas de uno u otro género.<\/li>\n<li>Salvo por razones técnicas, organizativas, económicas o productivas, graves y probadas, no se realizaran modificaciones sustanciales ni funcionales de las condiciones de trabajo de las mujeres embarazadas, personas que se encuentren disfrutando la suspensión por maternidad, personas que tengan a su cuidado directo menores de tres años, mayores enfermos y discapacitados o aquellas que estén ejerciendo derechos de conciliación.<\/li>\n<\/ul><p>En el caso de empresas de más de cincuenta personas trabajadoras, las medidas dirigidas a promover la igualdad de trato y oportunidades entre hombres y mujeres, deberán dirigirse a la elaboración y aplicación de un plan de igualdad. Para el resto de empresas la elaboración de los planes de igualdad será voluntaria.<\/p>", "x": " Las empresas se comprometen a la consecución de la igualdad real efectiva (de trato y oportunidades) de mujeres y hombres en el acceso a la empresa, la contratación y las condiciones de trabajo, la promoción profesional, la formación, la retribución, la conciliación de la vida personal, familiar y laboral y la salud laboral, garantizando los recursos humanos y materiales que sean necesarios para su debida implantación, seguimiento y evaluación. A tal efecto se creará una Comisión de seguimiento integrada por dos representantes de la empresa y dos representantes de las personas trabajadoras, para analizar los cumplimientos en materia de igualdad. Asimismo, se respetara la igualdad de trato y de oportunidades en el ámbito laboral y, con esta finalidad, deberán adoptarse medidas dirigidas a evitar cualquier tipo de discriminación laboral por razones de género, estado civil, edad, raza, nacionalidad, condición social, ideas religiosas o políticas, afiliación o no a un sindicato, así como por razones de lengua, entre mujeres y hombres, medidas que deberán negociar y en su caso acordar, con la representación legal de las personas trabajadoras, conforme determine la legislación laboral y que respetaran los siguientes principios: El establecimiento de sistemas de selección, clasificación, promoción y formación sobre la base de criterios técnicos, objetivos y neutros por razón de género que respetaran el principio de igualdad de oportunidades. La no discriminación por razón de sexo en materia de retribuciones, jornada laboral y demás condiciones de trabajo. Las ofertas de empleo se redactaran de manera que no contengan mención alguna que induzca a pensar que las mismas se dirigen exclusivamente a personas de uno u otro género. Salvo por razones técnicas, organizativas, económicas o productivas, graves y probadas, no se realizaran modificaciones sustanciales ni funcionales de las condiciones de trabajo de las mujeres embarazadas, personas que se encuentren disfrutando la suspensión por maternidad, personas que tengan a su cuidado directo menores de tres años, mayores enfermos y discapacitados o aquellas que estén ejerciendo derechos de conciliación. En el caso de empresas de más de cincuenta personas trabajadoras, las medidas dirigidas a promover la igualdad de trato y oportunidades entre hombres y mujeres, deberán dirigirse a la elaboración y aplicación de un plan de igualdad. Para el resto de empresas la elaboración de los planes de igualdad será voluntaria."}, {"id": "art-25", "t": "Artículo 25. Actuaciones frente al acoso en ámbito laboral", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 25, "h": "<ol>\n<li>Se promoverá en el ámbito del presente Convenio colectivo las condiciones de trabajo que eviten las situaciones de acoso bajo el principio general de colaboración entre la empresa y la representación de las personas trabajadoras para que haya tolerancia cero ante cualquier tipo de acoso.<\/li>\n<\/ol><ol>\n<li>Se considera acoso moral toda conducta, práctica o comportamiento realizado de forma sistemática o recurrente en el tiempo, en el seno de una relación de trabajo, que suponga directa o indirectamente un menoscabo o atentado contra la dignidad de la persona, a la cual se intenta someter emocional o psicológicamente de forma intimidatoria, degradante, humillante, violenta u hostil y que persigue anular su capacidad, promoción profesional o su permanencia en el puesto de trabajo, afectando negativamente al entorno laboral de la persona trabajadora en sus funciones diarias.<\/li>\n<\/ol><ol>\n<li>Constituye acoso sexual cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo.<\/li>\n<\/ol><ol>\n<li>Se considera acoso por razón de sexo cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo.<\/li>\n<li>Sin perjuicio de lo que se establezca en los planes de igualdad, con carácter general se establecen las siguientes medidas preventivas:<\/li>\n<\/ol><ol>\n<li>Sensibilizar a la plantilla tanto respecto a la definición y formas de manifestación de los diferentes tipos de acoso, como en los procedimientos de actuación establecidos en el presente artículo para los casos en que este pudiera producirse.<\/li>\n<\/ol><ol>\n<li>Impulsar la aplicación del principio de no tolerancia y de corresponsabilidad en cuanto a los comportamientos laborales que se desarrollen en la empresa, en especial por parte del personal con mayor nivel de mando y de responsabilidad.<\/li>\n<\/ol><ol>\n<li>Promover iniciativas formativas que favorezcan la comunicación entre personal con capacidad de mando y los respectivos equipos de trabajo en cualquiera de los niveles jerárquicos.<\/li>\n<\/ol><ol start=\"3\">\n<li>Las personas que se sientan acosadas podrán ponerlo inmediatamente en conocimiento de la dirección de la empresa de manera directa, o bien a través de la representación sindical. También podrá formular una denuncia de acoso cualquier persona que tenga conocimiento de la situación. En cualquier caso, la dirección de la empresa contará en todas sus actuaciones con la representación sindical, rigiéndose ambas en todo caso por los siguientes principios y criterios de actuación:<\/li>\n<\/ol><ol>\n<li>Garantía de confidencialidad y protección de la intimidad y la dignidad de las personas implicadas, con la preservación, en todo caso, de la identidad y circunstancias personales de quien denuncie. A tal fin las personas responsables de atender la denuncia de acoso respetarán en todo caso las condiciones de sigilo y discreción que indique la persona afectada.<\/li>\n<\/ol><ol>\n<li>Garantía de que la persona acosada pueda seguir en su puesto de trabajo en las mismas condiciones si esa es su voluntad. A tal fin se adoptarán las medidas cautelares orientadas al cese inmediato de la situación de acoso, teniendo en cuenta las necesidades organizativas y productivas que pudieran concurrir.<\/li>\n<\/ol><ol>\n<li>Prioridad y tramitación urgente de las actuaciones, que se orientarán a la investigación exhaustiva de los hechos por los medios que más eficazmente permitan esclarecerlos. A tal fin, las personas responsables de atender la denuncia se entrevistarán con las partes promoviendo soluciones que sean aceptadas por las partes implicadas, para lo cual éstas podrán estar acompañadas de quien decidan.<\/li>\n<\/ol><ol>\n<li>Garantía de actuación, adoptando las medidas necesarias, incluidas en su caso las de carácter disciplinario, contra la persona o personas cuyas conductas de acoso resulten probadas. A tal fin, si en el plazo de diez días hábiles desde que se tuvo conocimiento de la denuncia no se hubiera alcanzado una solución, se dará inicio al correspondiente procedimiento formal para el definitivo esclarecimiento de los hechos denunciados, cuya duración nunca excederá de quince días naturales. Las partes implicadas podrán ser asistidas y acompañadas por una persona de su confianza, quien deberá guardar sigilo y confidencialidad sobre toda la información a que tenga acceso y especialmente respecto de las actuaciones llevadas a cabo por las personas responsables de atender la denuncia.<\/li>\n<\/ol><ol>\n<li>Indemnidad frente a las represalias, garantizando que no se producirá trato adverso o efecto negativo en una persona como consecuencia de la presentación por su parte de denuncia o manifestación en cualquier sentido dirigida a impedir la situación de acoso y a iniciar las actuaciones establecidas en el presente artículo.<\/li>\n<\/ol><p>Una vez concluidas las anteriores actuaciones, y en un plazo máximo de quince días naturales, la dirección de la empresa adoptará las medidas correctoras comunicándolas a la representación sindical.<\/p>", "x": " Se promoverá en el ámbito del presente Convenio colectivo las condiciones de trabajo que eviten las situaciones de acoso bajo el principio general de colaboración entre la empresa y la representación de las personas trabajadoras para que haya tolerancia cero ante cualquier tipo de acoso. Se considera acoso moral toda conducta, práctica o comportamiento realizado de forma sistemática o recurrente en el tiempo, en el seno de una relación de trabajo, que suponga directa o indirectamente un menoscabo o atentado contra la dignidad de la persona, a la cual se intenta someter emocional o psicológicamente de forma intimidatoria, degradante, humillante, violenta u hostil y que persigue anular su capacidad, promoción profesional o su permanencia en el puesto de trabajo, afectando negativamente al entorno laboral de la persona trabajadora en sus funciones diarias. Constituye acoso sexual cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo. Se considera acoso por razón de sexo cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo. Sin perjuicio de lo que se establezca en los planes de igualdad, con carácter general se establecen las siguientes medidas preventivas: Sensibilizar a la plantilla tanto respecto a la definición y formas de manifestación de los diferentes tipos de acoso, como en los procedimientos de actuación establecidos en el presente artículo para los casos en que este pudiera producirse. Impulsar la aplicación del principio de no tolerancia y de corresponsabilidad en cuanto a los comportamientos laborales que se desarrollen en la empresa, en especial por parte del personal con mayor nivel de mando y de responsabilidad. Promover iniciativas formativas que favorezcan la comunicación entre personal con capacidad de mando y los respectivos equipos de trabajo en cualquiera de los niveles jerárquicos. Las personas que se sientan acosadas podrán ponerlo inmediatamente en conocimiento de la dirección de la empresa de manera directa, o bien a través de la representación sindical. También podrá formular una denuncia de acoso cualquier persona que tenga conocimiento de la situación. En cualquier caso, la dirección de la empresa contará en todas sus actuaciones con la representación sindical, rigiéndose ambas en todo caso por los siguientes principios y criterios de actuación: Garantía de confidencialidad y protección de la intimidad y la dignidad de las personas implicadas, con la preservación, en todo caso, de la identidad y circunstancias personales de quien denuncie. A tal fin las personas responsables de atender la denuncia de acoso respetarán en todo caso las condiciones de sigilo y discreción que indique la persona afectada. Garantía de que la persona acosada pueda seguir en su puesto de trabajo en las mismas condiciones si esa es su voluntad. A tal fin se adoptarán las medidas cautelares orientadas al cese inmediato de la situación de acoso, teniendo en cuenta las necesidades organizativas y productivas que pudieran concurrir. Prioridad y tramitación urgente de las actuaciones, que se orientarán a la investigación exhaustiva de los hechos por los medios que más eficazmente permitan esclarecerlos. A tal fin, las personas responsables de atender la denuncia se entrevistarán con las partes promoviendo soluciones que sean aceptadas por las partes implicadas, para lo cual éstas podrán estar acompañadas de quien decidan. Garantía de actuación, adoptando las medidas necesarias, incluidas en su caso las de carácter disciplinario, contra la persona o personas cuyas conductas de acoso resulten probadas. A tal fin, si en el plazo de diez días hábiles desde que se tuvo conocimiento de la denuncia no se hubiera alcanzado una solución, se dará inicio al correspondiente procedimiento formal para el definitivo esclarecimiento de los hechos denunciados, cuya duración nunca excederá de quince días naturales. Las partes implicadas podrán ser asistidas y acompañadas por una persona de su confianza, quien deberá guardar sigilo y confidencialidad sobre toda la información a que tenga acceso y especialmente respecto de las actuaciones llevadas a cabo por las personas responsables de atender la denuncia. Indemnidad frente a las represalias, garantizando que no se producirá trato adverso o efecto negativo en una persona como consecuencia de la presentación por su parte de denuncia o manifestación en cualquier sentido dirigida a impedir la situación de acoso y a iniciar las actuaciones establecidas en el presente artículo. Una vez concluidas las anteriores actuaciones, y en un plazo máximo de quince días naturales, la dirección de la empresa adoptará las medidas correctoras comunicándolas a la representación sindical."}, {"id": "art-26", "t": "Artículo 26. Salud Laboral", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 26, "h": "<p>Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería y a la normativa laboral vigente.<\/p>", "x": "Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería y a la normativa laboral vigente."}, {"id": "art-27", "t": "Artículo 27. Vigilancia de la Salud", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 27, "h": "<p>Se estará a lo dispuesto en el artículo 22 de la Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, la empresa garantizará el derecho de la persona trabajadora a la vigilancia de su salud a través de una revisión médica anual, está tendrá carácter voluntario para la persona trabajadora, excepto en los supuestos recogidos en dicho artículo.<\/p><p>El resultado de la revisión será comunicado por escrito a la persona trabajadora. El tiempo necesario para realizar la mencionada revisión, así como el necesario para el desplazamiento de la misma, será considerado como tiempo efectivo dentro de la jornada laboral.<\/p>", "x": "Se estará a lo dispuesto en el artículo 22 de la Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, la empresa garantizará el derecho de la persona trabajadora a la vigilancia de su salud a través de una revisión médica anual, está tendrá carácter voluntario para la persona trabajadora, excepto en los supuestos recogidos en dicho artículo. El resultado de la revisión será comunicado por escrito a la persona trabajadora. El tiempo necesario para realizar la mencionada revisión, así como el necesario para el desplazamiento de la misma, será considerado como tiempo efectivo dentro de la jornada laboral."}, {"id": "art-28", "t": "Artículo 28. Ropa de trabajo", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 28, "h": "<p>Las empresas vendrán obligadas a proporcionar a su personal los uniformes o la ropa de trabajo (calzado, pantalón, camisa, chaleco, chaquetilla o chaqueta, pajarita o corbata, gorro…) cuando las prendas estén deterioradas y como mínimo una vez cada doce meses.<\/p>", "x": "Las empresas vendrán obligadas a proporcionar a su personal los uniformes o la ropa de trabajo (calzado, pantalón, camisa, chaleco, chaquetilla o chaqueta, pajarita o corbata, gorro…) cuando las prendas estén deterioradas y como mínimo una vez cada doce meses."}, {"id": "art-29", "t": "Artículo 29. Formación profesional", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 29, "h": "<p>Las partes firmantes asumen el contenido íntegro de lo dispuesto por el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería vigente en cada momento, declarando que este desarrollará sus efectos en el ámbito funcional del presente convenio colectivo. Queda facultada la comisión paritaria para desarrollar cuantas iniciativas sean necesarias conducentes a efectos de la aplicación de dicho acuerdo.<\/p><p>En aras a conseguir un sector moderno y competitivo, es necesario contar con empresarios y personas trabajadoras con una formación adecuada y permanentemente actualizada. En consecuencia, la participación activa en aquellos modelos que garanticen el desarrollo de una formación de calidad es una apuesta necesaria para el desarrollo y mantenimiento de un sector hostelero competitivo y para la consecución de un empleo estable y de calidad dentro de la hostelería.<\/p>", "x": "Las partes firmantes asumen el contenido íntegro de lo dispuesto por el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería vigente en cada momento, declarando que este desarrollará sus efectos en el ámbito funcional del presente convenio colectivo. Queda facultada la comisión paritaria para desarrollar cuantas iniciativas sean necesarias conducentes a efectos de la aplicación de dicho acuerdo. En aras a conseguir un sector moderno y competitivo, es necesario contar con empresarios y personas trabajadoras con una formación adecuada y permanentemente actualizada. En consecuencia, la participación activa en aquellos modelos que garanticen el desarrollo de una formación de calidad es una apuesta necesaria para el desarrollo y mantenimiento de un sector hostelero competitivo y para la consecución de un empleo estable y de calidad dentro de la hostelería."}, {"id": "art-30", "t": "Artículo 30. Acreditación de la formación", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 30, "h": "<p>Sin perjuicio de que cualquier organismo, centro, entidad, etc… que cumpla todos los criterios que respecto de su acreditación determina la Orden de 18/10/2012 de la Consejería de Empleo y Economía, pueda impartir formación en el sector, la Comisión Paritaria de este Convenio, y con objeto de que dicha formación cumpla los objetivos establecidos en el artículo anterior, se constituye como Comisión para la Formación que visará y acreditará que todos los planes y los certificados de formación cumplen dichos objetivos.<\/p><p>En este sentido, se establecen estas opciones de acreditación.<\/p><ol>\n<li>Mediante certificación expedida por organización empresarial representativa del sector, en los términos establecidos por el artículo 87.3.c) del Estatuto de los Trabajadores, y que partícipe o promueva la formación específica para hostelería, que acredite su adhesión a la misma, con el visado de la Comisión Paritaria.<\/li>\n<li>Mediante certificación expedida por la empresa que acredite el desarrollo de planes individuales de formación, con el visado de la Comisión Paritaria. Dichas certificaciones tendrán validez anual, pudiendo ser renovadas automáticamente si se mantiene el cumplimiento de los requisitos tenidos en cuenta para su expedición, o revocadas en cualquier momento si se dejasen de cumplir.<\/li>\n<li>Mediante certificación expedida por organización sindical representativa del sector que acredite la participación de la empresa en algún plan agrupado de formación continua en materia de hostelería desarrollado por ellos, con el visado de la Comisión Paritaria.<\/li>\n<\/ol><p>Para las personas trabajadoras con contratos de duración superior a un año la acreditación de la formación deberá realizarse antes del 30 de enero del año posterior al que se pretende acreditar. Para las personas trabajadoras con contrato inferior al año, la fecha tope de acreditación de la formación será la fecha de fin del contrato.<\/p><p>Las horas de formación obligatoria a efectos del cobro del plus de formación recogido en el artículo 57.3, queda fijado en un mínimo de 10 horas anuales.<\/p>", "x": "Sin perjuicio de que cualquier organismo, centro, entidad, etc… que cumpla todos los criterios que respecto de su acreditación determina la Orden de 18/10/2012 de la Consejería de Empleo y Economía, pueda impartir formación en el sector, la Comisión Paritaria de este Convenio, y con objeto de que dicha formación cumpla los objetivos establecidos en el artículo anterior, se constituye como Comisión para la Formación que visará y acreditará que todos los planes y los certificados de formación cumplen dichos objetivos. En este sentido, se establecen estas opciones de acreditación. Mediante certificación expedida por organización empresarial representativa del sector, en los términos establecidos por el artículo 87.3.c) del Estatuto de los Trabajadores, y que partícipe o promueva la formación específica para hostelería, que acredite su adhesión a la misma, con el visado de la Comisión Paritaria. Mediante certificación expedida por la empresa que acredite el desarrollo de planes individuales de formación, con el visado de la Comisión Paritaria. Dichas certificaciones tendrán validez anual, pudiendo ser renovadas automáticamente si se mantiene el cumplimiento de los requisitos tenidos en cuenta para su expedición, o revocadas en cualquier momento si se dejasen de cumplir. Mediante certificación expedida por organización sindical representativa del sector que acredite la participación de la empresa en algún plan agrupado de formación continua en materia de hostelería desarrollado por ellos, con el visado de la Comisión Paritaria. Para las personas trabajadoras con contratos de duración superior a un año la acreditación de la formación deberá realizarse antes del 30 de enero del año posterior al que se pretende acreditar. Para las personas trabajadoras con contrato inferior al año, la fecha tope de acreditación de la formación será la fecha de fin del contrato. Las horas de formación obligatoria a efectos del cobro del plus de formación recogido en el artículo 57.3, queda fijado en un mínimo de 10 horas anuales."}, {"id": "art-31", "t": "Artículo 31. Información sobre formación", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 31, "h": "<p>Las organizaciones firmantes de este convenio, darán cuenta a la Comisión de Interpretación del mismo de la programación de planes y acciones formativas, con carácter previo a la realización de los mismos y con periodicidad anual, así como de los resultados y ejecución de los mismos.<\/p>", "x": "Las organizaciones firmantes de este convenio, darán cuenta a la Comisión de Interpretación del mismo de la programación de planes y acciones formativas, con carácter previo a la realización de los mismos y con periodicidad anual, así como de los resultados y ejecución de los mismos."}, {"id": "art-32", "t": "Artículo 32. Régimen disciplinario", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 32, "h": "<p>Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería vigente.<\/p>", "x": "Se estará a lo dispuesto en el Acuerdo Laboral de ámbito Estatal para el sector de Hostelería vigente."}, {"id": "art-33", "t": "Artículo 33. Clasificación Profesional", "k": "art", "c": "Capítulo III · Derechos sindicales, igualdad, salud laboral, formación y otros", "n": 33, "h": "<p>En materia de clasificación profesional y funciones derivadas de la misma, se estará a lo dispuesto en el VI Acuerdo Laboral de ámbito estatal para el sector de Hostelería en vigor, o aquel que lo sustituya durante la vigencia del presente Convenio provincial,<\/p><p>Además de lo cual habrá de atenderse a los siguientes ratios.<\/p><p>Las empresas, por centros de trabajo, vinculadas al presente Convenio se obligan como mínimo a:<\/p><ul>\n<li>Tener por cada CUATRO Ayudantes de Camarero/a, un/ a Camarero/a.<\/li>\n<\/ul><p>En las empresas donde las tareas inherentes a este departamento sean asumidas por el empresario, éste podrá contar con hasta cuatro ayudantes de camarero, que se encontrarán bajo su supervisión y dirección<\/p><ul>\n<li>Tener por cada TRES Ayudantes de Cocina, un/ a Cocinero/a.<\/li>\n<\/ul><p>En las empresas donde las tareas inherentes a este departamento sean asumidas por el empresario, éste podrá contar con hasta tres ayudantes de cocina, que se encontrarán bajo su supervisión y dirección.<\/p><p>No obstante, estos ratios se calcularán para personas trabajadoras con una antigüedad en la empresa superior a seis meses.<\/p>", "x": "En materia de clasificación profesional y funciones derivadas de la misma, se estará a lo dispuesto en el VI Acuerdo Laboral de ámbito estatal para el sector de Hostelería en vigor, o aquel que lo sustituya durante la vigencia del presente Convenio provincial, Además de lo cual habrá de atenderse a los siguientes ratios. Las empresas, por centros de trabajo, vinculadas al presente Convenio se obligan como mínimo a: Tener por cada CUATRO Ayudantes de Camarero/a, un/ a Camarero/a. En las empresas donde las tareas inherentes a este departamento sean asumidas por el empresario, éste podrá contar con hasta cuatro ayudantes de camarero, que se encontrarán bajo su supervisión y dirección Tener por cada TRES Ayudantes de Cocina, un/ a Cocinero/a. En las empresas donde las tareas inherentes a este departamento sean asumidas por el empresario, éste podrá contar con hasta tres ayudantes de cocina, que se encontrarán bajo su supervisión y dirección. No obstante, estos ratios se calcularán para personas trabajadoras con una antigüedad en la empresa superior a seis meses."}, {"id": "art-34", "t": "Artículo 34. Adaptación al puesto de trabajo", "k": "art", "c": "Capítulo IV · Cuestiones sociales", "n": 34, "h": "<p>Si la capacidad laboral de una persona trabajadora quedara limitada y, no le fuera reconocido un grado de Incapacidad Permanente de los que conforme al artículo 49.1.e) del Estatuto de los Trabajadores llevan aparejado la extinción del contrato de trabajo, la empresa le asignará un puesto de trabajo más adecuado a su capacidad laboral, siempre que ello fuera posible.<\/p>", "x": "Si la capacidad laboral de una persona trabajadora quedara limitada y, no le fuera reconocido un grado de Incapacidad Permanente de los que conforme al artículo 49.1.e) del Estatuto de los Trabajadores llevan aparejado la extinción del contrato de trabajo, la empresa le asignará un puesto de trabajo más adecuado a su capacidad laboral, siempre que ello fuera posible."}, {"id": "art-35", "t": "Artículo 35. Complementos de IT", "k": "art", "c": "Capítulo IV · Cuestiones sociales", "n": 35, "h": "<ol>\n<li>Accidente Laboral o Enfermedad Profesional<\/li>\n<\/ol><p>Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de accidente laboral o enfermedad profesional, percibirán con cargo a la empresa y desde el primer dia las diferencias existentes entre las prestaciones que por tal contingencia abone la seguridad social hasta completar el 100 % del salario, durante el tiempo que dure la relación laboral.<\/p><ol>\n<li>Contingencias Comunes (Especialmente Protegidas).<\/li>\n<\/ol><p>Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de contingencias comunes por tratamiento oncológico, intervención quirúrgica u hospitalización, percibirán con cargo a la empresa y desde el primer día las diferencias existentes entre las prestaciones que por tal contingencia abone la seguridad social hasta completar el 100 % del salario, durante el tiempo que dure la relación laboral, y hasta un máximo de 12 meses.<\/p><ol>\n<li>Resto de Contingencias Comunes.<\/li>\n<\/ol><p>Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de contingencias comunes por causas distintas a las del párrafo anterior percibirán con cargo a la empresa y durante los 3 primeros días de la baja el 50 % del Salario (Base reguladora del mes anterior al que se produce la baja), desde el 4° hasta el 20º día de la baja el 90% del Salario, y desde el 21° hasta 270° día de la baja el 100% del Salario.<\/p>", "x": " Accidente Laboral o Enfermedad Profesional Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de accidente laboral o enfermedad profesional, percibirán con cargo a la empresa y desde el primer dia las diferencias existentes entre las prestaciones que por tal contingencia abone la seguridad social hasta completar el 100 % del salario, durante el tiempo que dure la relación laboral. Contingencias Comunes (Especialmente Protegidas). Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de contingencias comunes por tratamiento oncológico, intervención quirúrgica u hospitalización, percibirán con cargo a la empresa y desde el primer día las diferencias existentes entre las prestaciones que por tal contingencia abone la seguridad social hasta completar el 100 % del salario, durante el tiempo que dure la relación laboral, y hasta un máximo de 12 meses. Resto de Contingencias Comunes. Las personas trabajadoras que se encuentren en situación de incapacidad temporal derivada de contingencias comunes por causas distintas a las del párrafo anterior percibirán con cargo a la empresa y durante los 3 primeros días de la baja el 50 % del Salario (Base reguladora del mes anterior al que se produce la baja), desde el 4° hasta el 20º día de la baja el 90% del Salario, y desde el 21° hasta 270° día de la baja el 100% del Salario."}, {"id": "art-36", "t": "Artículo 36. Seguro de accidentes", "k": "art", "c": "Capítulo IV · Cuestiones sociales", "n": 36, "h": "<p>Las empresas afectadas por este convenio deberán concertar con una entidad aseguradora una póliza de seguro a favor de las personas trabajadoras que garantice 18.000 euros de indemnización por accidente laboral con resultado de incapacidad permanente, gran invalidez o fallecimiento.<\/p>", "x": "Las empresas afectadas por este convenio deberán concertar con una entidad aseguradora una póliza de seguro a favor de las personas trabajadoras que garantice 18.000 euros de indemnización por accidente laboral con resultado de incapacidad permanente, gran invalidez o fallecimiento."}, {"id": "art-37", "t": "Artículo 37. Premios de vinculación y permisos retribuidos especiales", "k": "art", "c": "Capítulo IV · Cuestiones sociales", "n": 37, "h": "<p>Las personas trabajadoras que extingan su relación laboral con la empresa para acceder a la jubilación anticipada y en dicho momento hayan prestado al menos diez años de servicio en la misma, percibirán un premio de vinculación, que se abonará de una sola vez, de acuerdo a la siguiente tabla:<\/p><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>Edad de acceso a la jubilación<\/strong><\/th>\n<th align=\"right\"><strong>Mensualidades de salario<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Dentro del año anterior a la edad legal de jubilación<\/td>\n<td align=\"right\">2<\/td>\n<\/tr>\n<tr>\n<td>Entre 1 y 2 años antes de la edad legal de jubilación<\/td>\n<td align=\"right\">3<\/td>\n<\/tr>\n<\/tbody><\/table><\/div><p>Estos premios de vinculación podrán ser sustituidos por permisos retribuidos especiales, cambiando las mensualidades de salario por meses de permiso retribuido, que se disfrutarán en los meses inmediatamente anteriores a la fecha de jubilación.<\/p><p>La persona trabajadora deberá comunicar con un mes de antelación a la supuesta fecha de inicio del permiso, si opta por el premio de vinculación o por el permiso retribuido especial.<\/p>", "x": "Las personas trabajadoras que extingan su relación laboral con la empresa para acceder a la jubilación anticipada y en dicho momento hayan prestado al menos diez años de servicio en la misma, percibirán un premio de vinculación, que se abonará de una sola vez, de acuerdo a la siguiente tabla: Edad de acceso a la jubilación Mensualidades de salario Dentro del año anterior a la edad legal de jubilación 2 Entre 1 y 2 años antes de la edad legal de jubilación 3 Estos premios de vinculación podrán ser sustituidos por permisos retribuidos especiales, cambiando las mensualidades de salario por meses de permiso retribuido, que se disfrutarán en los meses inmediatamente anteriores a la fecha de jubilación. La persona trabajadora deberá comunicar con un mes de antelación a la supuesta fecha de inicio del permiso, si opta por el premio de vinculación o por el permiso retribuido especial."}, {"id": "art-38", "t": "Artículo 38. Jornada laboral anual y semanal", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 38, "h": "<p>La jornada laboral máxima para las personas trabajadoras contratadas a tiempo completo será de 1800 horas anuales, para los años 2025 y 2026 Dicha jornada se repartirá de modo que no se superen las 40 horas de trabajo semanales.<\/p><ul>\n<li>Para el año 2027, la jornada máxima establecida será de 1798.<\/li>\n<li>Para el año 2028, se establece una jornada máxima de 1796<\/li>\n<\/ul><p>Cuando la prestación de servicios se realice por un período de más de 6 horas continuadas, se tendrá derecho a un descanso de quince minutos como mínimo, que no computará como tiempo efectivo de trabajo.<\/p><p>Entre la terminación de la jornada ordinaria de trabajo y el comienzo de la otra deberán transcurrir como mínimo doce horas.<\/p><p>El descanso semanal será de día y medio ininterrumpido.<\/p><p>Se promoverá la utilización de la jornada continuada, el horario flexible u otros modos de organización del tiempo de trabajo y de los descansos que permitan la mayor compatibilidad entre el derecho a la conciliación de la vida personal, familiar y laboral de las personas trabajadoras y la mejora de la productividad en las empresas.<\/p>", "x": "La jornada laboral máxima para las personas trabajadoras contratadas a tiempo completo será de 1800 horas anuales, para los años 2025 y 2026 Dicha jornada se repartirá de modo que no se superen las 40 horas de trabajo semanales. Para el año 2027, la jornada máxima establecida será de 1798. Para el año 2028, se establece una jornada máxima de 1796 Cuando la prestación de servicios se realice por un período de más de 6 horas continuadas, se tendrá derecho a un descanso de quince minutos como mínimo, que no computará como tiempo efectivo de trabajo. Entre la terminación de la jornada ordinaria de trabajo y el comienzo de la otra deberán transcurrir como mínimo doce horas. El descanso semanal será de día y medio ininterrumpido. Se promoverá la utilización de la jornada continuada, el horario flexible u otros modos de organización del tiempo de trabajo y de los descansos que permitan la mayor compatibilidad entre el derecho a la conciliación de la vida personal, familiar y laboral de las personas trabajadoras y la mejora de la productividad en las empresas."}, {"id": "art-39", "t": "Artículo 39. Calendario laboral", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 39, "h": "<p>Las empresas expondrán antes del día 20 de cada mes un calendario laboral del mes siguiente, donde se hará constar, para cada persona trabajadora<\/p><ul>\n<li>Días de trabajo, con horario de entrada y salida<\/li>\n<li>Días de descanso semanal<\/li>\n<li>Días de vacaciones<\/li>\n<li>Días de compensación de festivos.<\/li>\n<\/ul>", "x": "Las empresas expondrán antes del día 20 de cada mes un calendario laboral del mes siguiente, donde se hará constar, para cada persona trabajadora Días de trabajo, con horario de entrada y salida Días de descanso semanal Días de vacaciones Días de compensación de festivos. "}, {"id": "art-40", "t": "Artículo 40. Vacaciones", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 40, "h": "<p>Las vacaciones anuales serán de 30 días naturales de los cuales, al menos 15 se disfrutarán ininterrumpidamente.<\/p><p>Las vacaciones se fijarán de común acuerdo entre empresa y personas trabajadoras. Cada persona trabajadora conocerá su fecha de vacaciones con dos meses de antelación al comienzo de las mismas.<\/p><p>Cuando el período de vacaciones fijado en el calendario de vacaciones de la empresa coincida en el tiempo con una incapacidad temporal derivada del embarazo, el parto o la lactancia natural o con el período de suspensión del contrato de trabajo previsto en el artículo 48.5, 48.7 y 48.8 del ET, se tendrá derecho a disfrutar las vacaciones en fecha distinta a la de la incapacidad temporal o a la del disfrute del permiso que por aplicación de dicho precepto le correspondiera, al finalizar el período de suspensión, aunque haya terminado el año natural a que correspondan.<\/p><p>En el supuesto de que el período de vacaciones coincida con una incapacidad temporal por contingencias distintas a las señaladas en el párrafo anterior que imposibilite a la persona trabajadora disfrutarlas, total o parcialmente, durante el año natural a que corresponden, la persona trabajadora podrá hacerlo una vez finalice su incapacidad y siempre que no hayan transcurrido más de dieciocho meses a partir del final del año en que se hayan originado.<\/p>", "x": "Las vacaciones anuales serán de 30 días naturales de los cuales, al menos 15 se disfrutarán ininterrumpidamente. Las vacaciones se fijarán de común acuerdo entre empresa y personas trabajadoras. Cada persona trabajadora conocerá su fecha de vacaciones con dos meses de antelación al comienzo de las mismas. Cuando el período de vacaciones fijado en el calendario de vacaciones de la empresa coincida en el tiempo con una incapacidad temporal derivada del embarazo, el parto o la lactancia natural o con el período de suspensión del contrato de trabajo previsto en el artículo 48.5, 48.7 y 48.8 del ET, se tendrá derecho a disfrutar las vacaciones en fecha distinta a la de la incapacidad temporal o a la del disfrute del permiso que por aplicación de dicho precepto le correspondiera, al finalizar el período de suspensión, aunque haya terminado el año natural a que correspondan. En el supuesto de que el período de vacaciones coincida con una incapacidad temporal por contingencias distintas a las señaladas en el párrafo anterior que imposibilite a la persona trabajadora disfrutarlas, total o parcialmente, durante el año natural a que corresponden, la persona trabajadora podrá hacerlo una vez finalice su incapacidad y siempre que no hayan transcurrido más de dieciocho meses a partir del final del año en que se hayan originado."}, {"id": "art-41", "t": "Artículo 41. Flexibilidad horaria, exceso de jornada y compensación", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 41, "h": "<p>Se considerará exceso de jornada el tiempo de trabajo efectivo que:<\/p><ul>\n<li>Supere las 40 horas semanales o las 180 horas mensuales (Sin perjuicio de la facultad del empresario de realizar una distribución irregular del 10% de la jornada anual, conforme a lo previsto en el artículo 34 del Estatuto de los Trabajadores.)<\/li>\n<li>Supere el límite anual establecido. Este límite anual será de 1.800 horas, salvo para los años 2027 y 2028, en los que el tope será de 1.798 y 1.796 horas respectivamente, según lo dispuesto en el artículo 38 del convenio.<\/li>\n<\/ul><p>Este exceso de jornada será compensado en tiempo de descanso (acumulando las horas en días o períodos completos) de la siguiente forma:<\/p><ul>\n<li>El exceso semanal, se compensará dentro de las 4 semanas siguientes a la semana en que se realiza.<\/li>\n<li>El exceso mensual, se compensará dentro de los 3 meses siguientes al mes en que se realiza.<\/li>\n<li>El exceso anual, se compensará dentro del primer trimestre del año siguiente al que se realiza.<\/li>\n<\/ul><p>Si transcurrido el plazo de compensación en tiempo de descanso no se hubiese compensado, las horas de exceso se transformarán en horas extraordinarias y se abonarán como tales, dentro de los límites que establece el E.T. (80 horas anuales), salvo pacto en contrario entre empresa y persona trabajadora.<\/p><p>La Dirección de la empresa informará mensualmente a la Representación Legal de las Personas Trabajadoras sobre el número de horas extraordinarias realizadas, especificando las causas y, en su caso, la distribución por secciones.<\/p><p>La realización de las horas extraordinarias se registrará día a día y se totalizará anualmente, entregando copia del resumen semanal a la persona trabajadora en el parte correspondiente.<\/p>", "x": "Se considerará exceso de jornada el tiempo de trabajo efectivo que: Supere las 40 horas semanales o las 180 horas mensuales (Sin perjuicio de la facultad del empresario de realizar una distribución irregular del 10% de la jornada anual, conforme a lo previsto en el artículo 34 del Estatuto de los Trabajadores.) Supere el límite anual establecido. Este límite anual será de 1.800 horas, salvo para los años 2027 y 2028, en los que el tope será de 1.798 y 1.796 horas respectivamente, según lo dispuesto en el artículo 38 del convenio. Este exceso de jornada será compensado en tiempo de descanso (acumulando las horas en días o períodos completos) de la siguiente forma: El exceso semanal, se compensará dentro de las 4 semanas siguientes a la semana en que se realiza. El exceso mensual, se compensará dentro de los 3 meses siguientes al mes en que se realiza. El exceso anual, se compensará dentro del primer trimestre del año siguiente al que se realiza. Si transcurrido el plazo de compensación en tiempo de d
