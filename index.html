escanso no se hubiese compensado, las horas de exceso se transformarán en horas extraordinarias y se abonarán como tales, dentro de los límites que establece el E.T. (80 horas anuales), salvo pacto en contrario entre empresa y persona trabajadora. La Dirección de la empresa informará mensualmente a la Representación Legal de las Personas Trabajadoras sobre el número de horas extraordinarias realizadas, especificando las causas y, en su caso, la distribución por secciones. La realización de las horas extraordinarias se registrará día a día y se totalizará anualmente, entregando copia del resumen semanal a la persona trabajadora en el parte correspondiente."}, {"id": "art-42", "t": "Artículo 42. Trabajo nocturno", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 42, "h": "<p>Cada hora trabajada entre las 22:00 horas y las 8:00 horas se computará, a efecto de contabilizar el número de horas trabajadas como 1,25 horas (1 hora y 15 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo anterior.<\/p>", "x": "Cada hora trabajada entre las 22:00 horas y las 8:00 horas se computará, a efecto de contabilizar el número de horas trabajadas como 1,25 horas (1 hora y 15 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo anterior."}, {"id": "art-43", "t": "Artículo 43. Trabajo en festivos y Servicios en 24 y 31 de diciembre", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 43, "h": "<ol>\n<li><strong>Trabajo en Festivos:<\/strong><\/li>\n<\/ol><ol>\n<li>Se consideran festivos, los doce festivos nacionales y los dos locales.<\/li>\n<\/ol><ol>\n<li>Cada hora trabajada en festivo se computará, a efecto de contabilizar el número de horas trabajadas como 1,75 horas (1 hora y 45 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo 41.<\/li>\n<\/ol><ol>\n<li><p>El 29 de julio (Santa Marta), tendrán un día de descanso. En los casos en que dicha festividad coincidiese con domingo <\/p>\n<ol>\n<li>en el día de libranza de la persona trabajadora, no se recuperará, y si el establecimiento no puede cerrar con motivo de tal festividad la persona trabajadora que preste servicio percibirá la correspondiente compensación económica, computándose las horas trabajadas como 1,75 horas (1 hora y 45 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo 41.<\/li>\n<\/ol>\n<\/li>\n<li><p><strong>La Prestación de servicios durante los días 24 y/o 31 de diciembre<\/strong>, se ajustará a las siguientes normas (a partir del año 2026):<\/p>\n<\/li>\n<\/ol><ol>\n<li>Cuando por razones de índole productiva, técnica, organizativa o de servicio, la empresa precise de las personas trabajadoras la prestación de servicios durante los días 24 y 31 de diciembre para la atención del servicio de cenas, y éste se prolongue más allá de las 23:00 horas, se compensará con los siguientes complementos:<\/li>\n<\/ol><ul>\n<li>Si el servicio pasa de las 23:00 horas pero no se alarga hasta más allá de las 24:00, se abonará un complemento de 20 €.<\/li>\n<li>Si el servicio pasa de las 24:00 horas pero no se alarga hasta más allá de la 01:00 horas del día siguiente, se abonará un complemento de 40 €.<\/li>\n<li>Si el servicio pasa de las 01:00 del día siguiente se abonará un complemento de 60€.<\/li>\n<\/ul><p>Para el resto de años se aplicarán las cantidades reflejadas en el Anexo III de Condiciones Económicas<\/p><ol>\n<li>Para la prestación de servicio durante los días 24 de diciembre, 25 de diciembre, 31 de diciembre y 1 de enero, cuando no sea necesario todo el personal para la atención de dicho servicio, se favorecerá la turnicidad, de manera que las personas trabajadoras presten servicio dos días de los cuatro indicados<\/li>\n<\/ol><ol>\n<li>Lo dispuesto en los apartados precedentes no se aplicará a los Bares Especiales, Discotecas, Salas de Fiesta, Cafés-Teatro, etc<\/li>\n<\/ol>", "x": " Trabajo en Festivos: Se consideran festivos, los doce festivos nacionales y los dos locales. Cada hora trabajada en festivo se computará, a efecto de contabilizar el número de horas trabajadas como 1,75 horas (1 hora y 45 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo 41. El 29 de julio (Santa Marta), tendrán un día de descanso. En los casos en que dicha festividad coincidiese con domingo en el día de libranza de la persona trabajadora, no se recuperará, y si el establecimiento no puede cerrar con motivo de tal festividad la persona trabajadora que preste servicio percibirá la correspondiente compensación económica, computándose las horas trabajadas como 1,75 horas (1 hora y 45 minutos), tratándose los excesos de jornada generados de la forma que establece el artículo 41. La Prestación de servicios durante los días 24 y/o 31 de diciembre , se ajustará a las siguientes normas (a partir del año 2026): Cuando por razones de índole productiva, técnica, organizativa o de servicio, la empresa precise de las personas trabajadoras la prestación de servicios durante los días 24 y 31 de diciembre para la atención del servicio de cenas, y éste se prolongue más allá de las 23:00 horas, se compensará con los siguientes complementos: Si el servicio pasa de las 23:00 horas pero no se alarga hasta más allá de las 24:00, se abonará un complemento de 20 €. Si el servicio pasa de las 24:00 horas pero no se alarga hasta más allá de la 01:00 horas del día siguiente, se abonará un complemento de 40 €. Si el servicio pasa de las 01:00 del día siguiente se abonará un complemento de 60€. Para el resto de años se aplicarán las cantidades reflejadas en el Anexo III de Condiciones Económicas Para la prestación de servicio durante los días 24 de diciembre, 25 de diciembre, 31 de diciembre y 1 de enero, cuando no sea necesario todo el personal para la atención de dicho servicio, se favorecerá la turnicidad, de manera que las personas trabajadoras presten servicio dos días de los cuatro indicados Lo dispuesto en los apartados precedentes no se aplicará a los Bares Especiales, Discotecas, Salas de Fiesta, Cafés-Teatro, etc "}, {"id": "art-44", "t": "Artículo 44. Licencias y permisos", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 44, "h": "<p>La persona trabajadora, previo aviso y justificación, podrá ausentarse del trabajo, con derecho a remuneración, por alguno de los motivos y por el tiempo siguiente:<\/p><ol>\n<li>Tres días por fallecimiento de familiares hasta segundo grado de consanguinidad o afinidad, garantizando que al menos dos de ellos se disfruten en días laborables.<\/li>\n<\/ol><ol>\n<li>Cinco días laborables por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario, de parientes hasta el segundo grado de consanguinidad o afinidad, incluido el familiar consanguíneo de la pareja de hecho, así como de cualquier otra persona distinta de las anteriores, que conviva con la persona trabajadora en el mismo domicilio y que requiera el cuidado efectivo de aquella.<\/li>\n<\/ol><p>Estos días podrán disfrutarse de forma discontinua durante el período que dure el motivo causante.<\/p><ol>\n<li>Un día por matrimonio de familiares hasta segundo grado de consanguinidad o afinidad.<\/li>\n<\/ol><p>En los apartados a) (fallecimiento familiar) y c) (matrimonio familiar) se añadirán días por desplazamiento, de la siguiente forma:<\/p><ul>\n<li>A otra localidad dentro de la misma provincia: un día.<\/li>\n<li>A una provincia limítrofe: dos días<\/li>\n<li>Al resto de España: tres días<\/li>\n<li>Fuera de España: cuatro días, a los que se podrán añadir hasta cinco días más no retribuidos<\/li>\n<\/ul><p>En el apartado b) (accidente, enfermedad grave, hospitalización, intervención) se añadirán días por desplazamiento de la siguiente forma:<\/p><p>Para desplazamientos al resto de España más allá de una provincia límitrofe: un día. Y para desplazamientos fuera de España: dos días, a los que se podrá añadir hasta cinco días más no retribuidos.<\/p><ol>\n<li>Quince días naturales en caso de matrimonio o registro como pareja de hecho.<\/li>\n<\/ol><ol>\n<li>Dos días por traslado del domicilio habitual.<\/li>\n<\/ol><ol>\n<li>Por el tiempo indispensable, para el cumplimiento de un deber inexcusable de carácter público y personal, en los términos del establecidos en el artículo 37.3.d) del Estatuto de los Trabajadores<\/li>\n<\/ol><ol>\n<li>Por el tiempo indispensable para la renovación del permiso de trabajo o residencia de la persona trabajadora y su cónyuge o ascendientes y descendientes directos.<\/li>\n<\/ol><ol>\n<li>Por el tiempo indispensable para la realización de exámenes prenatales, técnicas de preparación al parto, técnicas de fecundación asistida y en los casos de adopción o acogimiento, o guarda con fines de adopción, para la asistencia a las preceptivas sesiones de información y preparación y para la realización de los preceptivos informes psicológicos y sociales previos a la declaración de idoneidad, siempre y en todos los casos que deban realizarse dentro de la jornada de trabajo.<\/li>\n<\/ol><ol>\n<li><p>El tiempo necesario e indispensable para asistir a cualquier tipo de consulta médica propia, de hijos o hijas menores, <\/p>\n<ol>\n<li>familiares de primer grado de consanguinidad o afinidad mayores o con discapacidad dependientes; viniendo las personas trabajadoras obligadas a justificar debidamente la asistencia a dicha consulta.<\/li>\n<\/ol>\n<\/li>\n<li><p>El tiempo necesario e imprescindible para el examen del carnet de conducir.<\/p>\n<\/li>\n<\/ol><ol>\n<li>Por el tiempo necesario que precise la persona trabajadora para concurrir a exámenes en centros de formación académica, profesional o social.<\/li>\n<\/ol><ol>\n<li>Tres días por asuntos propios, en proporción al tiempo trabajado e independientemente de la jornada que realice, que deberá ser solicitado por la persona trabajadora con diez días de antelación y que no podrá ser negado por la empresa, excepto que el mismo día lo haya pedido con antelación otra persona trabajadora del mismo departamento. Estos días no serán acumulables, y podrá ser denegado por parte de la empresa su disfrute durante el mes de agosto, Semana Santa, puentes y festivos, así como de viernes a domingo.<\/li>\n<\/ol><ol>\n<li>Para realizar funciones sindicales o de representación del personal en los términos establecidos legal o convencionalmente.<\/li>\n<\/ol><ol>\n<li>Ausencia por fuerza mayor La persona trabajadora tendrá derecho a ausentarse del trabajo por causa de fuerza mayor cuando sea necesario por motivos familiares urgentes relacionados con familiares o personas convivientes, en caso de enfermedad o accidente que hagan indispensable su presencia inmediata. Las personas trabajadoras tendrán derecho a que sean retribuidas las horas de ausencia por las causas previstas en el presente apartado equivalentes a cuatro días al año, conforme a lo establecido en convenio colectivo o, en su defecto, en acuerdo entre la empresa y la representación legal de las personas trabajadoras aportando las personas trabajadoras, en su caso, acreditación del motivo de la ausencia.<\/li>\n<\/ol><p>Para establecer la relación de afinidad, se tendrán los mismos derechos, tanto si se trata de matrimonio como de parejas de hecho.<\/p><p>En todo aquellos permisos retribuidos en los que se hace referencia a su disfrute en días laborables, se hace con la intención de evitar la discrepancia que ya ha sido resuelta por la Jurisprudencia del Tribunal Supremo. No obstante, si la Jurisprudencia del TS o el Estatuto de los Trabajadores, sobre la condición laborable o no, de los días retribuidos fuera modificada en un futuro, las partes firmantes de este convenio se comprometen a asumir la nueva doctrina jurisprudencial y a cambiar el contenido de este artículo en el mismo sentido.<\/p><p>Además de los permisos retribuidos anteriormente citados, las personas trabajadoras sujetas al presente Convenio tendrán los siguientes permisos en las condiciones y términos que se detallan a continuación para cada uno de los casos conforme a los dispuesto en el art. 37. 5 y 6 del LET: <\/p><ol>\n<li>Las personas trabajadoras tendrán derecho a ausentarse del trabajo durante una hora en el caso de nacimiento prematuro de hijo o hija, o, que, cualquier cosa, deban permanecer hospitalizados a continuación del parto. Asimismo, tendrán derecho a reducir su jornada de trabajo hasta un máximo de dos horas, con la disminución proporcional del salario. Y para el disfrute de este permiso se estará a lo previsto en el art. 37.7 del Estatuto de los Trabajadores.<\/li>\n<li>Quien por razones de guarda legal tenga a su cuidado directo algún menor de doce años o una persona con discapacidad que no desempeñe una actividad retribuida, tendrá derecho a una reducción de la jornada de trabajo diaria, con la disminución proporcional del salario entre, al menos, un octavo y un máximo de la mitad de la duración de aquella.<\/li>\n<\/ol><p>Tendrá el mismo derecho quien precise encargarse del cuidado directo del cónyuge o pareja de hecho, o un familiar hasta el segundo grado de consanguinidad y afinidad, incluido el familiar consanguíneo de la pareja de hecho, que por razones de edad, accidente o enfermedad no pueda valerse por sí mismos, y que no se desempeñe una actividad retribuida. <\/p><p>El progenitor, guardador con fines de adopción o acogedor permanente tendrá derecho a una reducción de la jornada de trabajo, con la disminución proporcional del salario de, al menos, la mitad de la duración de aquella, para el cuidado, durante la hospitalización y tratamiento continuado, del menor a su cargo afectado por cáncer (tumores malignos, melanomas y carcinomas), o por cualquier otra enfermedad grave, que implique un ingreso hospitalario de larga duración y requiera la necesidad de su cuidado directo, continuo y permanente, acreditado por el informe del servicio público de salud o órgano administrativo sanitario de la comunidad autónoma correspondiente y, como máximo, hasta que el hijo o persona que hubiera sido objeto de acogimiento permanente o de guarda con fines de adopción cumpla vientres años. <\/p><p>En consecuencia, el mero cumplimiento de los dieciocho años de edad por el hijo o el menor sujeto a acogimiento permanente o a guarda con fines de adopción no será causa de extinción de la reducción de la jornada, si se mantiene la necesidad de cuidado directo, continuo y permanente. <\/p><p>No obstante, cumplido los 18 años, se podrá reconocer el derecho a la reducción de jornada hasta que el causante cumpla 23 años en los supuestos en que el padecimiento de cáncer o enfermedad grave haya sido diagnosticado antes de alcanzar la mayoría de edad, siempre que en el momento de la solicitud se acrediten los requisitos establecidos en los párrafos anteriores, salvo la edad. <\/p><p>Asimismo, se mantendrá el derecho a esta reducción hasta que la persona cumpla 26 años si antes de alcanzar 23 años acreditará, además, un grado de discapacidad igual o superior al 65%.<\/p><p>Por convenio colectivo, se podrán establecer las condiciones y supuestos en los que esta reducción de jornada se podrá acumular en jornadas completas.<\/p><p>En los supuestos de nulidad, separación, divorcio, extinción de la pareja de hecho o cuando se acredite ser victima de violencia de género, el derecho a la reducción de jornada se reconocerá a favor del progenitor, guardador o acogedor con quien conviva la persona enferma, siempre que se cumpla el resto de los requisitos exigidos.<\/p><p>Cuando la persona enferma que se encuentra en los supuestos previstos en los párrafos tercero y cuarto de este apartado contraiga matrimonio o constituya una pareja de hecho, tendrá derecho a la reducción de jornada quien sea su cónyuge o pareja de hecho, siempre que acredite las condiciones para acceder al derecho de la misma.<\/p><p>Las reducciones de jornada contempladas en este apartado constituyen un derecho individual de los trabajadores, hombres o mujeres. No obstante, si dos o más trabajadores de la misma empresa generasen este derecho por el mismo sujeto causante, el empresario podrá limitar su ejercicio simultaneo por razones fundadas y objetivas de funcionamiento de la empresa, debidamente motivadas por escrito, debiendo en tal caso la empresa ofrecer un plan alternativo que asegure el disfrute de ambas personas trabajadoras y que posibilite el ejercicio de los derechos de conciliación. <\/p><p>En el ejercicio de este derecho se tendrá en cuenta el fomento de la corresponsabilidad entre mujeres y hombres y, asimismo, evitar la perpetuación de roles y estereotipos de género.<\/p><p>En todo lo no dispuesto en este artículo, se estará a lo establecido en el artículo 37 del Estatuto de los Trabajadores.<\/p>", "x": "La persona trabajadora, previo aviso y justificación, podrá ausentarse del trabajo, con derecho a remuneración, por alguno de los motivos y por el tiempo siguiente: Tres días por fallecimiento de familiares hasta segundo grado de consanguinidad o afinidad, garantizando que al menos dos de ellos se disfruten en días laborables. Cinco días laborables por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario, de parientes hasta el segundo grado de consanguinidad o afinidad, incluido el familiar consanguíneo de la pareja de hecho, así como de cualquier otra persona distinta de las anteriores, que conviva con la persona trabajadora en el mismo domicilio y que requiera el cuidado efectivo de aquella. Estos días podrán disfrutarse de forma discontinua durante el período que dure el motivo causante. Un día por matrimonio de familiares hasta segundo grado de consanguinidad o afinidad. En los apartados a) (fallecimiento familiar) y c) (matrimonio familiar) se añadirán días por desplazamiento, de la siguiente forma: A otra localidad dentro de la misma provincia: un día. A una provincia limítrofe: dos días Al resto de España: tres días Fuera de España: cuatro días, a los que se podrán añadir hasta cinco días más no retribuidos En el apartado b) (accidente, enfermedad grave, hospitalización, intervención) se añadirán días por desplazamiento de la siguiente forma: Para desplazamientos al resto de España más allá de una provincia límitrofe: un día. Y para desplazamientos fuera de España: dos días, a los que se podrá añadir hasta cinco días más no retribuidos. Quince días naturales en caso de matrimonio o registro como pareja de hecho. Dos días por traslado del domicilio habitual. Por el tiempo indispensable, para el cumplimiento de un deber inexcusable de carácter público y personal, en los términos del establecidos en el artículo 37.3.d) del Estatuto de los Trabajadores Por el tiempo indispensable para la renovación del permiso de trabajo o residencia de la persona trabajadora y su cónyuge o ascendientes y descendientes directos. Por el tiempo indispensable para la realización de exámenes prenatales, técnicas de preparación al parto, técnicas de fecundación asistida y en los casos de adopción o acogimiento, o guarda con fines de adopción, para la asistencia a las preceptivas sesiones de información y preparación y para la realización de los preceptivos informes psicológicos y sociales previos a la declaración de idoneidad, siempre y en todos los casos que deban realizarse dentro de la jornada de trabajo. El tiempo necesario e indispensable para asistir a cualquier tipo de consulta médica propia, de hijos o hijas menores, familiares de primer grado de consanguinidad o afinidad mayores o con discapacidad dependientes; viniendo las personas trabajadoras obligadas a justificar debidamente la asistencia a dicha consulta. El tiempo necesario e imprescindible para el examen del carnet de conducir. Por el tiempo necesario que precise la persona trabajadora para concurrir a exámenes en centros de formación académica, profesional o social. Tres días por asuntos propios, en proporción al tiempo trabajado e independientemente de la jornada que realice, que deberá ser solicitado por la persona trabajadora con diez días de antelación y que no podrá ser negado por la empresa, excepto que el mismo día lo haya pedido con antelación otra persona trabajadora del mismo departamento. Estos días no serán acumulables, y podrá ser denegado por parte de la empresa su disfrute durante el mes de agosto, Semana Santa, puentes y festivos, así como de viernes a domingo. Para realizar funciones sindicales o de representación del personal en los términos establecidos legal o convencionalmente. Ausencia por fuerza mayor La persona trabajadora tendrá derecho a ausentarse del trabajo por causa de fuerza mayor cuando sea necesario por motivos familiares urgentes relacionados con familiares o personas convivientes, en caso de enfermedad o accidente que hagan indispensable su presencia inmediata. Las personas trabajadoras tendrán derecho a que sean retribuidas las horas de ausencia por las causas previstas en el presente apartado equivalentes a cuatro días al año, conforme a lo establecido en convenio colectivo o, en su defecto, en acuerdo entre la empresa y la representación legal de las personas trabajadoras aportando las personas trabajadoras, en su caso, acreditación del motivo de la ausencia. Para establecer la relación de afinidad, se tendrán los mismos derechos, tanto si se trata de matrimonio como de parejas de hecho. En todo aquellos permisos retribuidos en los que se hace referencia a su disfrute en días laborables, se hace con la intención de evitar la discrepancia que ya ha sido resuelta por la Jurisprudencia del Tribunal Supremo. No obstante, si la Jurisprudencia del TS o el Estatuto de los Trabajadores, sobre la condición laborable o no, de los días retribuidos fuera modificada en un futuro, las partes firmantes de este convenio se comprometen a asumir la nueva doctrina jurisprudencial y a cambiar el contenido de este artículo en el mismo sentido. Además de los permisos retribuidos anteriormente citados, las personas trabajadoras sujetas al presente Convenio tendrán los siguientes permisos en las condiciones y términos que se detallan a continuación para cada uno de los casos conforme a los dispuesto en el art. 37. 5 y 6 del LET: Las personas trabajadoras tendrán derecho a ausentarse del trabajo durante una hora en el caso de nacimiento prematuro de hijo o hija, o, que, cualquier cosa, deban permanecer hospitalizados a continuación del parto. Asimismo, tendrán derecho a reducir su jornada de trabajo hasta un máximo de dos horas, con la disminución proporcional del salario. Y para el disfrute de este permiso se estará a lo previsto en el art. 37.7 del Estatuto de los Trabajadores. Quien por razones de guarda legal tenga a su cuidado directo algún menor de doce años o una persona con discapacidad que no desempeñe una actividad retribuida, tendrá derecho a una reducción de la jornada de trabajo diaria, con la disminución proporcional del salario entre, al menos, un octavo y un máximo de la mitad de la duración de aquella. Tendrá el mismo derecho quien precise encargarse del cuidado directo del cónyuge o pareja de hecho, o un familiar hasta el segundo grado de consanguinidad y afinidad, incluido el familiar consanguíneo de la pareja de hecho, que por razones de edad, accidente o enfermedad no pueda valerse por sí mismos, y que no se desempeñe una actividad retribuida. El progenitor, guardador con fines de adopción o acogedor permanente tendrá derecho a una reducción de la jornada de trabajo, con la disminución proporcional del salario de, al menos, la mitad de la duración de aquella, para el cuidado, durante la hospitalización y tratamiento continuado, del menor a su cargo afectado por cáncer (tumores malignos, melanomas y carcinomas), o por cualquier otra enfermedad grave, que implique un ingreso hospitalario de larga duración y requiera la necesidad de su cuidado directo, continuo y permanente, acreditado por el informe del servicio público de salud o órgano administrativo sanitario de la comunidad autónoma correspondiente y, como máximo, hasta que el hijo o persona que hubiera sido objeto de acogimiento permanente o de guarda con fines de adopción cumpla vientres años. En consecuencia, el mero cumplimiento de los dieciocho años de edad por el hijo o el menor sujeto a acogimiento permanente o a guarda con fines de adopción no será causa de extinción de la reducción de la jornada, si se mantiene la necesidad de cuidado directo, continuo y permanente. No obstante, cumplido los 18 años, se podrá reconocer el derecho a la reducción de jornada hasta que el causante cumpla 23 años en los supuestos en que el padecimiento de cáncer o enfermedad grave haya sido diagnosticado antes de alcanzar la mayoría de edad, siempre que en el momento de la solicitud se acrediten los requisitos establecidos en los párrafos anteriores, salvo la edad. Asimismo, se mantendrá el derecho a esta reducción hasta que la persona cumpla 26 años si antes de alcanzar 23 años acreditará, además, un grado de discapacidad igual o superior al 65%. Por convenio colectivo, se podrán establecer las condiciones y supuestos en los que esta reducción de jornada se podrá acumular en jornadas completas. En los supuestos de nulidad, separación, divorcio, extinción de la pareja de hecho o cuando se acredite ser victima de violencia de género, el derecho a la reducción de jornada se reconocerá a favor del progenitor, guardador o acogedor con quien conviva la persona enferma, siempre que se cumpla el resto de los requisitos exigidos. Cuando la persona enferma que se encuentra en los supuestos previstos en los párrafos tercero y cuarto de este apartado contraiga matrimonio o constituya una pareja de hecho, tendrá derecho a la reducción de jornada quien sea su cónyuge o pareja de hecho, siempre que acredite las condiciones para acceder al derecho de la misma. Las reducciones de jornada contempladas en este apartado constituyen un derecho individual de los trabajadores, hombres o mujeres. No obstante, si dos o más trabajadores de la misma empresa generasen este derecho por el mismo sujeto causante, el empresario podrá limitar su ejercicio simultaneo por razones fundadas y objetivas de funcionamiento de la empresa, debidamente motivadas por escrito, debiendo en tal caso la empresa ofrecer un plan alternativo que asegure el disfrute de ambas personas trabajadoras y que posibilite el ejercicio de los derechos de conciliación. En el ejercicio de este derecho se tendrá en cuenta el fomento de la corresponsabilidad entre mujeres y hombres y, asimismo, evitar la perpetuación de roles y estereotipos de género. En todo lo no dispuesto en este artículo, se estará a lo establecido en el artículo 37 del Estatuto de los Trabajadores."}, {"id": "art-45", "t": "Artículo 45. Flexibilidad por conciliación", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 45, "h": "<p>Las personas trabajadoras afectadas por este convenio que tengan a su cargo hijos, hijas o menores de seis años en acogimiento familiar permanente o adoptivo, gozarán de un turno de trabajo adaptado al horario de guardería o centro de enseñanza donde acudan éstos. El tiempo a emplear con tal fin, que será el indispensable, se recuperará con posterioridad.<\/p>", "x": "Las personas trabajadoras afectadas por este convenio que tengan a su cargo hijos, hijas o menores de seis años en acogimiento familiar permanente o adoptivo, gozarán de un turno de trabajo adaptado al horario de guardería o centro de enseñanza donde acudan éstos. El tiempo a emplear con tal fin, que será el indispensable, se recuperará con posterioridad."}, {"id": "art-46", "t": "Artículo 46. Permiso de lactancia", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 46, "h": "<p>El permiso de lactancia establecido en el artículo 37.4 del Estatuto de los Trabajadores podrá ser acumulado en jornadas completas que se calcularan de la siguiente forma: 15 dividido por el porcentaje de jornada de la persona trabajadora = número de días naturales de permiso.<\/p>", "x": "El permiso de lactancia establecido en el artículo 37.4 del Estatuto de los Trabajadores podrá ser acumulado en jornadas completas que se calcularan de la siguiente forma: 15 dividido por el porcentaje de jornada de la persona trabajadora = número de días naturales de permiso."}, {"id": "art-47", "t": "Artículo 47. Excedencias voluntarias", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 47, "h": "<p>La persona trabajadora que disfrute de una excedencia voluntaria de acuerdo con el artículo 46.2 del estatuto de los trabajadores tendrá derecho de reserva de un puesto de trabajo del mismo grupo profesional o categoría equivalente durante el periodo de un año, transcurrido este conserva sólo un derecho preferente al reingreso en las vacantes de igual o similar categoría a la suya que hubiera o se produjeran en la empresa de acuerdo con el artículo 46.5 del Estatuto de los Trabajadores.<\/p>", "x": "La persona trabajadora que disfrute de una excedencia voluntaria de acuerdo con el artículo 46.2 del estatuto de los trabajadores tendrá derecho de reserva de un puesto de trabajo del mismo grupo profesional o categoría equivalente durante el periodo de un año, transcurrido este conserva sólo un derecho preferente al reingreso en las vacantes de igual o similar categoría a la suya que hubiera o se produjeran en la empresa de acuerdo con el artículo 46.5 del Estatuto de los Trabajadores."}, {"id": "art-48", "t": "Artículo 48. Licencia sin sueldo", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 48, "h": "<p>Las personas trabajadoras, que lleven más de un año en la empresa, tendrán derecho a una excedencia con reserva de puesto de trabajo de hasta un mes de duración, este permiso sin sueldo sólo podrá disfrutarse una vez al año, deberá ser solicitada por la persona trabajadora con una antelación mínima de un mes al comienzo de su disfrute y la empresa podrá negarla si otra persona trabajadora de la misma sección ha solicitado esta excedencia con anterioridad para disfrutarla en las mismas fechas o si coincidiera con los periodos de máxima actividad del negocio.<\/p>", "x": "Las personas trabajadoras, que lleven más de un año en la empresa, tendrán derecho a una excedencia con reserva de puesto de trabajo de hasta un mes de duración, este permiso sin sueldo sólo podrá disfrutarse una vez al año, deberá ser solicitada por la persona trabajadora con una antelación mínima de un mes al comienzo de su disfrute y la empresa podrá negarla si otra persona trabajadora de la misma sección ha solicitado esta excedencia con anterioridad para disfrutarla en las mismas fechas o si coincidiera con los periodos de máxima actividad del negocio."}, {"id": "art-49", "t": "Artículo 49. Excedencia familiar especial", "k": "art", "c": "Capítulo V · Ordenación del tiempo de trabajo", "n": 49, "h": "<p>Con motivo de accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario de familiares de primer grado de consanguinidad o afinidad (padres, madres, hijos, hijas y cónyuge), la persona trabajadora podrá solicitar de la empresa una excedencia familiar especial con reserva de puesto de trabajo de hasta cuatro meses de duración.<\/p><p>En caso de que la evolución del familiar enfermo sea favorable, la persona trabajadora podrá reincorporarse a su puesto de trabajo antes de que pase el periodo máximo de la excedencia, solicitándolo con siete días de antelación.<\/p>", "x": "Con motivo de accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario de familiares de primer grado de consanguinidad o afinidad (padres, madres, hijos, hijas y cónyuge), la persona trabajadora podrá solicitar de la empresa una excedencia familiar especial con reserva de puesto de trabajo de hasta cuatro meses de duración. En caso de que la evolución del familiar enfermo sea favorable, la persona trabajadora podrá reincorporarse a su puesto de trabajo antes de que pase el periodo máximo de la excedencia, solicitándolo con siete días de antelación."}, {"id": "art-50", "t": "Artículo 50. Pago del salario", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 50, "h": "<p>El pago de las nóminas se efectuará mensualmente antes del día 5 del mes siguiente al que corresponda la nómina.<\/p><p>La persona trabajadora tendrá derecho a percibir anticipos a cuenta por el trabajo realizado, sin que pueda exceder del 90% del importe del salario y previa justificación de su necesidad<\/p>", "x": "El pago de las nóminas se efectuará mensualmente antes del día 5 del mes siguiente al que corresponda la nómina. La persona trabajadora tendrá derecho a percibir anticipos a cuenta por el trabajo realizado, sin que pueda exceder del 90% del importe del salario y previa justificación de su necesidad"}, {"id": "art-51", "t": "Artículo 51. Conceptos económicos", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 51, "h": "<p>La retribución de las personas trabajadoras afectadas por el presente convenio estará formada por Salario Base y Complementos<\/p>", "x": "La retribución de las personas trabajadoras afectadas por el presente convenio estará formada por Salario Base y Complementos"}, {"id": "art-52", "t": "Artículo 52. Salario Base", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 52, "h": "<p>El Salario Base remunera el trabajo correspondiente a la categoría profesional y la jornada laboral de cada persona trabajadora, la cuantía del mismo se establece, en cantidad anual, en el Anexo III (Condiciones Económicas), en la que se incluye la cantidad correspondiente a gratificaciones extraordinarias.<\/p><p>El salario base se establece en función del nivel retributivo correspondiente a la categoría profesional de la persona trabajadora, de acuerdo al Anexo I (Niveles Retributivos), y la categoría de establecimiento en el que la persona trabajadora presta sus servicios, de acuerdo al Anexo II (Grupos de Establecimientos).<\/p>", "x": "El Salario Base remunera el trabajo correspondiente a la categoría profesional y la jornada laboral de cada persona trabajadora, la cuantía del mismo se establece, en cantidad anual, en el Anexo III (Condiciones Económicas), en la que se incluye la cantidad correspondiente a gratificaciones extraordinarias. El salario base se establece en función del nivel retributivo correspondiente a la categoría profesional de la persona trabajadora, de acuerdo al Anexo I (Niveles Retributivos), y la categoría de establecimiento en el que la persona trabajadora presta sus servicios, de acuerdo al Anexo II (Grupos de Establecimientos)."}, {"id": "art-53", "t": "Artículo 53. Incrementos Salariales", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 53, "h": "<p>Los incrementos salariales serán los siguientes:<\/p><ol>\n<li>Para el año 2025, se mantienen las tablas salariales revisadas del año 2024.<\/li>\n<li>Para el año 2026, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada, será del 4% aplicable sobre las tablas de 2025.<\/li>\n<\/ol><p>En el caso de que el IPC interanual del año 2026 supere el 4%, se revisarán las tablas hasta un máximo del 0,5 %.<\/p><ol start=\"3\">\n<li>Para el año 2027, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada será del 4 % aplicable sobre las tablas definitivas de 2026.<\/li>\n<\/ol><p>En el caso de que el IPC interanual del año 2027 supere el 4 %, se revisarán las tablas hasta un máximo del 0,5 %.<\/p><ol start=\"4\">\n<li>Para el año 2028, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada será del 3% aplicable sobre las tablas definitivas de 2027.<\/li>\n<\/ol><p>En el caso de que el IPC interanual del año 2028 supere el 3 %, se revisarán las tablas hasta un máximo del 0,5 %.<\/p><p>El abono de los atrasos del año 2026 se hará efectivo por las empresas en la nómina del mes siguiente al de la publicación del presente convenio en el boletín oficial de la provincia.<\/p>", "x": "Los incrementos salariales serán los siguientes: Para el año 2025, se mantienen las tablas salariales revisadas del año 2024. Para el año 2026, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada, será del 4% aplicable sobre las tablas de 2025. En el caso de que el IPC interanual del año 2026 supere el 4%, se revisarán las tablas hasta un máximo del 0,5 %. Para el año 2027, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada será del 4 % aplicable sobre las tablas definitivas de 2026. En el caso de que el IPC interanual del año 2027 supere el 4 %, se revisarán las tablas hasta un máximo del 0,5 %. Para el año 2028, el incremento para todos los conceptos económicos, excepto la antigüedad consolidada será del 3% aplicable sobre las tablas definitivas de 2027. En el caso de que el IPC interanual del año 2028 supere el 3 %, se revisarán las tablas hasta un máximo del 0,5 %. El abono de los atrasos del año 2026 se hará efectivo por las empresas en la nómina del mes siguiente al de la publicación del presente convenio en el boletín oficial de la provincia."}, {"id": "art-54", "t": "Artículo 54. Complemento Personal (Antigüedad consolidada) y Plus Compensatorio", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 54, "h": "<ol>\n<li>Las personas trabajadoras mantienen el complemento personal derivado de la antigüedad en la cantidad consolidada en el periodo que va del 1 de enero de 2016 hasta el 31 de diciembre de 2018, de acuerdo a la tabla de antigüedad, que se reproduce en el Anexo IV de este convenio. Este complemento se percibirá por 14 pagas, tal y como se hacía en los convenios anteriores y no tiene la condición de revalorizable.<\/li>\n<li>Todas las personas trabajadoras recibirán un plus compensatorio cuya cuantía aparece en el anexo III del presente convenio.<\/li>\n<\/ol>", "x": " Las personas trabajadoras mantienen el complemento personal derivado de la antigüedad en la cantidad consolidada en el periodo que va del 1 de enero de 2016 hasta el 31 de diciembre de 2018, de acuerdo a la tabla de antigüedad, que se reproduce en el Anexo IV de este convenio. Este complemento se percibirá por 14 pagas, tal y como se hacía en los convenios anteriores y no tiene la condición de revalorizable. Todas las personas trabajadoras recibirán un plus compensatorio cuya cuantía aparece en el anexo III del presente convenio. "}, {"id": "art-55", "t": "Artículo 55. Gratificaciones Extraordinarias", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 55, "h": "<p>El salario base y el plus compensatorio, se dividen en 12 mensualidades más 3 pagas extraordinarias, estas pagas se abonarán de la siguiente forma:<\/p><ul>\n<li>Paga de Verano: se abonará el 20 de junio, correspondiente al primer semestre del año.<\/li>\n<li>Paga de Navidad: se abonará el 20 de diciembre, correspondiente al segundo semestre del año.<\/li>\n<li>Tercera Paga: se abonará un 50% el 20 de marzo (correspondiente al período entre el 1 de octubre del año anterior y el 31 de marzo del año en curso) y otro 50% el 20 de septiembre (correspondiente al período entre el 1 de abril y el 31 de octubre del año en curso.<\/li>\n<\/ul><p>Por acuerdo entre empresa y personas trabajadoras, estas pagas extraordinarias podrán prorratearse mensualmente.<\/p>", "x": "El salario base y el plus compensatorio, se dividen en 12 mensualidades más 3 pagas extraordinarias, estas pagas se abonarán de la siguiente forma: Paga de Verano: se abonará el 20 de junio, correspondiente al primer semestre del año. Paga de Navidad: se abonará el 20 de diciembre, correspondiente al segundo semestre del año. Tercera Paga: se abonará un 50% el 20 de marzo (correspondiente al período entre el 1 de octubre del año anterior y el 31 de marzo del año en curso) y otro 50% el 20 de septiembre (correspondiente al período entre el 1 de abril y el 31 de octubre del año en curso. Por acuerdo entre empresa y personas trabajadoras, estas pagas extraordinarias podrán prorratearse mensualmente."}, {"id": "art-56", "t": "Artículo 56. Complemento Lineal de Convenio", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 56, "h": "<p>Se establece un complemento lineal de convenio, que se abonará completo a todas las personas trabajadoras, cuya jornada supere las 40 horas mensuales o 440 horas anuales.<\/p><p>Este complemento sustituye a los antiguos conceptos de plus extrasalarial y plus de transporte.<\/p><p>Para jornadas que no superen la jornada establecida en el punto anterior se abonará en proporción al tiempo trabajado y exceptuando a los trabajadores contratados como “extras”.<\/p>", "x": "Se establece un complemento lineal de convenio, que se abonará completo a todas las personas trabajadoras, cuya jornada supere las 40 horas mensuales o 440 horas anuales. Este complemento sustituye a los antiguos conceptos de plus extrasalarial y plus de transporte. Para jornadas que no superen la jornada establecida en el punto anterior se abonará en proporción al tiempo trabajado y exceptuando a los trabajadores contratados como “extras”."}, {"id": "art-57", "t": "Artículo 57. Otros complementos", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 57, "h": "<ol>\n<li>Plus de calzado.<\/li>\n<\/ol><p>Dadas las especiales características personales del calzado de trabajo, aquellas personas trabajadoras que opten por adquirirlo por su cuenta, siguiendo las especificaciones de la empresa en materia de vestuario, recibirán un complemento de calzado.<\/p><ol start=\"2\">\n<li>Plus de mantenimiento de vestuario.<\/li>\n<\/ol><p>La conservación y limpieza de los uniformes y ropa de trabajo corresponde a las empresas, en caso contrario se abonará un complemento de conservación de uniforme a las personas trabajadoras.<\/p><ol start=\"3\">\n<li>Plus de formación.<\/li>\n<\/ol><p>Aquellas empresas que no acrediten el cumplimiento de los requisitos establecidos en el artículo 30 del presente convenio colectivo, deberán abonar a sus personas trabajadoras un plus compensatorio de formación, de naturaleza salarial. En todo caso las personas trabajadoras afectadas por el presente convenio podrán recabar información a la comisión paritaria referente a la vigencia y validez de la certificación invocada por la empresa, a los efectos de reclamar este plus de formación si hubiere lugar a ello.<\/p>", "x": " Plus de calzado. Dadas las especiales características personales del calzado de trabajo, aquellas personas trabajadoras que opten por adquirirlo por su cuenta, siguiendo las especificaciones de la empresa en materia de vestuario, recibirán un complemento de calzado. Plus de mantenimiento de vestuario. La conservación y limpieza de los uniformes y ropa de trabajo corresponde a las empresas, en caso contrario se abonará un complemento de conservación de uniforme a las personas trabajadoras. Plus de formación. Aquellas empresas que no acrediten el cumplimiento de los requisitos establecidos en el artículo 30 del presente convenio colectivo, deberán abonar a sus personas trabajadoras un plus compensatorio de formación, de naturaleza salarial. En todo caso las personas trabajadoras afectadas por el presente convenio podrán recabar información a la comisión paritaria referente a la vigencia y validez de la certificación invocada por la empresa, a los efectos de reclamar este plus de formación si hubiere lugar a ello."}, {"id": "art-58", "t": "Artículo 58. Alojamiento y Manutención", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 58, "h": "<p>Las personas trabajadoras que tengan derecho, según la antigua Ordenanza Laboral de Hostelería, percibirán como complemento salarial en especie, con cargo a la empresa la manutención y/o el alojamiento.<\/p><p>Estos complementos en especie podrán sustituirse por las cantidades mensuales establecidas en el Anexo III (Condiciones Económicas)<\/p>", "x": "Las personas trabajadoras que tengan derecho, según la antigua Ordenanza Laboral de Hostelería, percibirán como complemento salarial en especie, con cargo a la empresa la manutención y/o el alojamiento. Estos complementos en especie podrán sustituirse por las cantidades mensuales establecidas en el Anexo III (Condiciones Económicas)"}, {"id": "art-59", "t": "Artículo 59. Cálculo del salario hora", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 59, "h": "<p>El cálculo del salario hora para las personas trabajadoras afectadas por el presente convenio se calculará de la siguiente fórmula:<\/p><ul>\n<li><p><strong>Salario Hora = (SB + CLC + CPA + PCA) / HJA<\/strong><\/p>\n<ul>\n<li>SB: Salario Base Anual<\/li>\n<li>CLC: Complemento Lineal de Convenio Anual<\/li>\n<li>CPA: Complemento Personal de Antigüedad Consolidada Anual.<\/li>\n<li>PCA: Plus Compensatorio Anual<\/li>\n<li>HJA: Horas de Jornada Anual<\/li>\n<\/ul>\n<\/li>\n<\/ul>", "x": "El cálculo del salario hora para las personas trabajadoras afectadas por el presente convenio se calculará de la siguiente fórmula: Salario Hora = (SB + CLC + CPA + PCA) / HJA SB: Salario Base Anual CLC: Complemento Lineal de Convenio Anual CPA: Complemento Personal de Antigüedad Consolidada Anual. PCA: Plus Compensatorio Anual HJA: Horas de Jornada Anual "}, {"id": "art-60", "t": "Artículo 60. Complemento por horas extraordinarias", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 60, "h": "<p>Cuando los excesos de jornada establecidos en los artículos 41 (Flexibilidad horaria, exceso de jornada y compensación), 42 (Trabajo nocturno) y 43 (Trabajo en festivos) de este convenio, se conviertan en horas extraordinarias, por no haber sido compensados en el plazo correspondiente, se abonarán con un precio del 175% de la hora ordinaria.<\/p>", "x": "Cuando los excesos de jornada establecidos en los artículos 41 (Flexibilidad horaria, exceso de jornada y compensación), 42 (Trabajo nocturno) y 43 (Trabajo en festivos) de este convenio, se conviertan en horas extraordinarias, por no haber sido compensados en el plazo correspondiente, se abonarán con un precio del 175% de la hora ordinaria."}, {"id": "art-61", "t": "Artículo 61. Retribución de los contratos formativos", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 61, "h": "<p><strong>Contrato para la adquisición de la práctica profesional:<\/strong><\/p><p>La retribución por el tiempo de trabajo efectivo será la del grupo profesional y nivel retributivo correspondiente a las funciones desempeñadas. En ningún caso la retribución podrá ser inferior a la retribución mínima establecida para el contrato para la formación en alternancia ni al salario mínimo profesionalmente en proporción al tiempo de trabajo efectivo.<\/p><p><strong>Contrato de formación en alternancia:<\/strong><\/p><ul>\n<li>La retribución no podrá ser inferior al sesenta por ciento (60%) el primer año ni al setenta y cinco por ciento (75%) el segundo, respecto de la fijada en convenio para el grupo profesional y nivel retributivo correspondiente a las funciones desempeñadas, en proporción al tiempo de trabajo efectivo. En ningún caso la retribución podrá ser inferior al salario mínimo interprofesional en proporción al tiempo de trabajo efectivo.<\/li>\n<\/ul>", "x": "Contrato para la adquisición de la práctica profesional: La retribución por el tiempo de trabajo efectivo será la del grupo profesional y nivel retributivo correspondiente a las funciones desempeñadas. En ningún caso la retribución podrá ser inferior a la retribución mínima establecida para el contrato para la formación en alternancia ni al salario mínimo profesionalmente en proporción al tiempo de trabajo efectivo. Contrato de formación en alternancia: La retribución no podrá ser inferior al sesenta por ciento (60%) el primer año ni al setenta y cinco por ciento (75%) el segundo, respecto de la fijada en convenio para el grupo profesional y nivel retributivo correspondiente a las funciones desempeñadas, en proporción al tiempo de trabajo efectivo. En ningún caso la retribución podrá ser inferior al salario mínimo interprofesional en proporción al tiempo de trabajo efectivo. "}, {"id": "art-62", "t": "Artículo 62. Trabajo a porcentaje y abono de tronco", "k": "art", "c": "Capítulo VI · Condiciones económicas", "n": 62, "h": "<p>Se respetará el percibo del salario de las personas trabajadoras que lo hagan a porcentaje, aplicándose lo establecido en la antigua Ordenanza Laboral de Hostelería.<\/p><p>El abono de tronco se hará efectivo mensualmente por todas las empresas y revisado dentro de los cinco días últimos de cada mes y los cinco primeros del mes siguiente.<\/p>", "x": "Se respetará el percibo del salario de las personas trabajadoras que lo hagan a porcentaje, aplicándose lo establecido en la antigua Ordenanza Laboral de Hostelería. El abono de tronco se hará efectivo mensualmente por todas las empresas y revisado dentro de los cinco días últimos de cada mes y los cinco primeros del mes siguiente."}, {"id": "s63", "t": "Disposiciones transitorias", "k": "disp", "c": "Disposiciones transitorias", "n": null, "h": "<p>Primera. Cálculo de incrementos salariales.<\/p><ol>\n<li>Salario base y plus compensatorio: A la cantidad anual del año anterior se le ha aplicado el incremento correspondiente, se ha dividido por 15 y se ha redondeado a 2 decimales (céntimos de euro), esta última cantidad se ha multiplicado por 15, dando la cantidad anual del año.<\/li>\n<li>Resto de complementos: A la cantidad anual del año anterior se le ha aplicado el incremento correspondiente, se ha dividido por 12 y se ha redondeado a 2 decimales (céntimos de euro), esta última cantidad se ha multiplicado por 12, dando la cantidad anual del año.<\/li>\n<\/ol><p>Segunda. Legislación y normativa referenciada<\/p><p>Todas las referencias a legislación y normativa (Estatuto de los Trabajadores, Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería etc…) se refieren a los textos vigentes a fecha 13 de julio de 2026.<\/p>", "x": "Primera. Cálculo de incrementos salariales. Salario base y plus compensatorio: A la cantidad anual del año anterior se le ha aplicado el incremento correspondiente, se ha dividido por 15 y se ha redondeado a 2 decimales (céntimos de euro), esta última cantidad se ha multiplicado por 15, dando la cantidad anual del año. Resto de complementos: A la cantidad anual del año anterior se le ha aplicado el incremento correspondiente, se ha dividido por 12 y se ha redondeado a 2 decimales (céntimos de euro), esta última cantidad se ha multiplicado por 12, dando la cantidad anual del año. Segunda. Legislación y normativa referenciada Todas las referencias a legislación y normativa (Estatuto de los Trabajadores, Acuerdo Laboral de Ámbito Estatal para el sector de Hostelería etc…) se refieren a los textos vigentes a fecha 13 de julio de 2026."}, {"id": "s64", "t": "Disposición adicional", "k": "disp", "c": "Disposición adicional", "n": null, "h": "<p>PROTOCOLO DE MEDIDAS LGTBI.<\/p><p>La Comisión Negociadora acuerda, que será de aplicación obligatoria el anexo 2 del Real Decreto 1026/2024, de 8 de octubre, por el que se desarrolla el conjunto planificado de las medidas de igualdad y no discriminación de las personas LGTBI, por orientación e identidad sexual y expresión de género.<\/p>", "x": "PROTOCOLO DE MEDIDAS LGTBI. La Comisión Negociadora acuerda, que será de aplicación obligatoria el anexo 2 del Real Decreto 1026/2024, de 8 de octubre, por el que se desarrolla el conjunto planificado de las medidas de igualdad y no discriminación de las personas LGTBI, por orientación e identidad sexual y expresión de género."}, {"id": "s65", "t": "ANEXO I — NIVELES SALARIALE  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(n=>{const t=n.nodeValue,nt=[...t].map(c=>c.normalize('NFD')[0].toLowerCase()).join('');
  const rg=[];terms.forEach(x=>{let i=0;while((i=nt.indexOf(x,i))>-1){rg.push([i,i+x.length]);i+=x.length}});
  if(!rg.length)return;rg.sort((a,b)=>a[0]-b[0]);const m=[];rg.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push([...r])});

}

 });
